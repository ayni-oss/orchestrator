<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script nonce="%sveltekit.nonce%">
      try {
        const savedTheme = localStorage.getItem("ayni-theme");
        document.documentElement.classList.toggle("dark", savedTheme === "dark" || (savedTheme === null && matchMedia("(prefers-color-scheme: dark)").matches));
      } catch {
        // The light theme remains usable when browser storage is unavailable.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
