[workspace]
members = [
    "backend/libs/events",
    "backend/libs/providers",
    "backend/servers/control-plane/crates/grpc-contract",
    "backend/libs/domain",
    "backend/libs/registry",
    "backend/libs/oci",
    "backend/libs/observability",
    "backend/servers/control-plane",
    "backend/workers/conversation-supervisor",
    "backend/workers/runtime-verifier",
    "backend/tests/workflow-acceptance",
    "backend/servers/control-plane/crates/workflow-postgres",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/ayni-oss/orchestrator"
publish = false

[workspace.dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "aws-lc-rs"] }
ed25519-dalek = "=2.2.0"
url = "=2.5.8"
cloudevents-sdk = { version = "=0.9.0", default-features = false }
pbjson = "=0.9.0"
pbjson-types = "=0.9.0"
pbjson-build = "=0.9.0"
async-stream = "0.3.6"
axum = "0.8.8"
http-body-util = "0.1.3"
k8s-openapi = { version = "=0.28.0", features = ["v1_32"] }
kube = { version = "=4.2.0", default-features = false, features = ["aws-lc-rs", "client", "rustls-tls", "ws"] }
rustix = { version = "=1.1.5", features = ["process"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rig-agent = { version = "=0.42.0", default-features = false }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
jsonwebtoken = { version = "=10.3.0", features = ["rust_crypto"] }
base64 = "=0.22.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
quote = "1.0.45"
syn = { version = "2.0.119", features = ["full"] }
tempfile = "=3.27.0"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "tls-aws-lc", "transport"] }
tonic-health = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tonic-reflection = "=0.14.6"
tokio-stream = "=0.1.19"
futures-util = "=0.3.34"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
hmac = "=0.12.1"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "process", "sync", "time", "io-util"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tower = { version = "0.5.2", features = ["util"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "=1.26.1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
