syntax = "proto3";

package ayni.orchestrator.feasibility.v1;

// This service exists only inside the PostgreSQL feasibility crate. It is not a
// production private-v1 descriptor or listener registration.
service WorkflowWatchFeasibility {
  rpc GetSnapshot(GetSnapshotRequest) returns (ConversationSnapshot);
  rpc WatchConversation(WatchConversationRequest) returns (stream WatchFrame);
}

message GetSnapshotRequest {
  string conversation_id = 1;
}

message WatchConversationRequest {
  string conversation_id = 1;
  optional string after_cursor = 2;
}

message ConversationSnapshot {
  string conversation_id = 1;
  uint64 revision = 2;
  string title = 3;
  string resume_cursor = 4;
}

message ConversationUpdate {
  uint64 revision = 1;
  string kind = 2;
  string safe_payload = 3;
  string cursor = 4;
}

message WatchFrame {
  oneof frame {
    ConversationSnapshot snapshot = 1;
    ConversationUpdate update = 2;
    Heartbeat heartbeat = 3;
  }
}

message Heartbeat {}
