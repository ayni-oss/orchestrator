ayni-orchestrator:
  enabled: true
  runtime:
    # Native Apple Silicon validation; override explicitly on Intel hosts.
    allowEmulation: false
    # Explicit development-only exception; production defaults stay non-privileged.
    engineMode: local-development
    builderDefaults:
      builder_image: ""
      engine_image: docker.io/library/docker:28.3.3-dind@sha256:a56b3bdde89315ed2cc0e4906e582b5033d93bf20d9cb9510c2cdd4e7f7690b1
      provisioning_base: ghcr.io/ayni-oss/ayni-provisioning@sha256:30453fcd751acff069c7b16a1cd2eba01051bd94b64cd9d333c4ce82a9ff0961
    managedRuntime:
      platform: linux/arm64
      service_account: runtime-coding
      pull_secret: runtime-pull
  images:
    controlPlane: local/ayni-orchestrator-control-plane:replace-me
    web: local/ayni-orchestrator-web:replace-me
    pullPolicy: Never
observability:
  enabled: true

prometheus:
  rbac:
    create: false
  serviceAccounts:
    server:
      create: false
      name: prometheus
  commonMetaLabels:
    orchestrator.ayni.dev/stack: observability
  configmapReload:
    prometheus:
      enabled: true
      image:
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: v0.85.0
        digest: sha256:ebb560bcb6bd3ab728a7ab61d77d22a001cc0c7a67f0531e7f92e20ce004de38
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus
    configMapOverrideName: prometheus-config
    podAnnotations:
      kubectl.kubernetes.io/default-container: prometheus-server
    image:
      repository: prom/prometheus
      tag: v3.5.0
      digest: sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
      pullPolicy: IfNotPresent
    persistentVolume:
      enabled: false
    emptyDir:
      sizeLimit: 1Gi
    service:
      type: ClusterIP
      servicePort: 9090
    retention: 48h
    retentionSize: 900MB
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 300m
        memory: 384Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.16.0
    sha: sha256:e750cd4b43f782e3106537026c2995cac85d921aedea334e1d16caad7877c360
    pullPolicy: IfNotPresent
  rbac:
    create: false
  serviceAccount:
    create: false
    name: kube-state-metrics
    automountServiceAccountToken: true
  releaseNamespace: true
  collectors:
    - jobs
    - persistentvolumeclaims
    - pods
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name,app.kubernetes.io/part-of,orchestrator.ayni.dev/development-task-id,orchestrator.ayni.dev/task-id,orchestrator.ayni.dev/development-stage]
    - jobs=[app.kubernetes.io/name,app.kubernetes.io/part-of,orchestrator.ayni.dev/development-task-id,orchestrator.ayni.dev/task-id,orchestrator.ayni.dev/development-stage]
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi
  customLabels:
    orchestrator.ayni.dev/stack: observability

grafana:
  fullnameOverride: grafana
  rbac:
    create: false
  serviceAccount:
    create: false
    automountServiceAccountToken: false
  automountServiceAccountToken: false
  testFramework:
    enabled: false
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 12.1.1
    sha: a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  persistence:
    enabled: false
    inMemory:
      enabled: true
      sizeLimit: 64Mi
  initChownData:
    enabled: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  extraContainerVolumes:
    - name: scratch
      emptyDir:
        sizeLimit: 64Mi
  extraVolumeMounts:
    - name: scratch
      mountPath: /tmp
      readOnly: false
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    # Bound Go scheduler parallelism within the local sub-core CPU quota.
    GOMAXPROCS: "1"
    GF_ANALYTICS_REPORTING_ENABLED: "false"
    GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    GF_AUTH_ANONYMOUS_ENABLED: "true"
    GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    GF_AUTH_DISABLE_LOGIN_FORM: "true"
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: Ayni Orchestrator
          orgId: 1
          folder: Ayni Orchestrator
          type: file
          disableDeletion: true
          editable: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: grafana-dashboard
  extraLabels:
    app.kubernetes.io/part-of: ayni-orchestrator-observability
    orchestrator.ayni.dev/stack: observability
