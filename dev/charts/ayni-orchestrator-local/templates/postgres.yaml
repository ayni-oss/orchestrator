{{- if .Values.postgres.enabled }}
{{- if or (eq .Values.postgres.secrets.admin .Values.postgres.secrets.migrator) (eq .Values.postgres.secrets.admin .Values.postgres.secrets.runtime) (eq .Values.postgres.secrets.migrator .Values.postgres.secrets.runtime) }}
{{- fail "postgres administrator, migrator, and runtime Secret names must differ" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-postgres-bootstrap
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: workflow-postgres
data:
  10-bootstrap-roles.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=migrator_user="$POSTGRES_MIGRATOR_USER" \
      --set=migrator_password="$POSTGRES_MIGRATOR_PASSWORD" \
      --set=runtime_user="$POSTGRES_RUNTIME_USER" \
      --set=runtime_password="$POSTGRES_RUNTIME_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'migrator_user', :'migrator_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'migrator_user') \gexec
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'runtime_user', :'runtime_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'runtime_user') \gexec
    REVOKE ALL ON DATABASE :"DBNAME" FROM PUBLIC;
    GRANT CONNECT ON DATABASE :"DBNAME" TO :"migrator_user", :"runtime_user";
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO :"migrator_user";
    GRANT USAGE ON SCHEMA public TO :"runtime_user";
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: workflow-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: workflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workflow-postgres
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: workflow-postgres
spec:
  serviceName: {{ .Values.postgres.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-postgres
        app.kubernetes.io/part-of: ayni-orchestrator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-postgres-volume
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -ec
            - |
              if [ "$(stat -c '%u:%g' /var/lib/postgresql/data)" != "999:999" ]; then
                chown -R 999:999 /var/lib/postgresql/data
              fi
              chmod 0700 /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.admin | quote }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.admin | quote }}
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.admin | quote }}
                  key: database
            - name: POSTGRES_MIGRATOR_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.migrator | quote }}
                  key: username
            - name: POSTGRES_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.migrator | quote }}
                  key: password
            - name: POSTGRES_RUNTIME_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.runtime | quote }}
                  key: username
            - name: POSTGRES_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secrets.runtime | quote }}
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\""]
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready --username=\"$POSTGRES_USER\" --dbname=\"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/10-bootstrap-roles.sh
              subPath: 10-bootstrap-roles.sh
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: workflow-postgres-bootstrap
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: workflow-postgres
          app.kubernetes.io/part-of: ayni-orchestrator
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
