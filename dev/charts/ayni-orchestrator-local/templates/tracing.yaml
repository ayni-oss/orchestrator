{{- define "local.tracingConfig" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-config
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 96
        spike_limit_mib: 16
      batch:
        timeout: 1s
        send_batch_size: 128
        send_batch_max_size: 256
    exporters:
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true
        timeout: 2s
        sending_queue:
          queue_size: 128
        retry_on_failure:
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 10s
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
  jaeger.yaml: |
    extensions:
      jaeger_storage:
        backends:
          primary:
            memory:
              max_traces: 1000
      jaeger_query:
        storage:
          traces: primary
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
        timeout: 1s
    exporters:
      jaeger_storage_exporter:
        trace_storage: primary
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
{{- end -}}
{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-config
data:
  traces-endpoint: http://otel-collector:4318/v1/traces
---
{{ include "local.tracingConfig" . }}
{{- range $name := list "otel-collector" "jaeger" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "local.observabilityLabels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ include "local.tracingConfig" $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ if eq $name "jaeger" }}{{ $.Values.observability.jaegerImage | quote }}{{ else }}{{ $.Values.observability.collectorImage | quote }}{{ end }}
          args: ["--config=/config/{{ if eq $name "jaeger" }}jaeger{{ else }}collector{{ end }}.yaml"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            {{- if eq $name "jaeger" }}
            - {name: otlp, containerPort: 4317}
            - {name: query, containerPort: 16686}
            {{- else }}
            - {name: otlp, containerPort: 4318}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ if eq $name "jaeger" }}query{{ else }}otlp{{ end }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: tracing-config}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    {{- if eq $name "jaeger" }}
    - {name: query, port: 16686, targetPort: query}
    - {name: otlp, port: 4317, targetPort: otlp}
    {{- else }}
    - {name: otlp, port: 4318, targetPort: otlp}
    {{- end }}
{{- end }}
{{- end }}
