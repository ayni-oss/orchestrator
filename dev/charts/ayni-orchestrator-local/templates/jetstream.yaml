{{- define "local.jetstreamConfig" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jetstream-config
data:
  nats.conf: |
    server_name: local-jetstream
    port: 4222
    http: 127.0.0.1:8222
    max_payload: 16384
    max_connections: 64
    max_pending: 1048576
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 0
      max_file_store: {{ int64 .Values.jetstream.maxFileBytes }}
    }
  lifecycle.json: |
    {
      "name": "ORCHESTRATOR_LIFECYCLE",
      "description": "Accepted controller facts; database and retained evidence remain authoritative",
      "subjects": ["orchestrator.runtime.verification.accepted.v1", "orchestrator.runtime.operation.accepted.v1", "orchestrator.coding.accepted.v1", "orchestrator.lifecycle.accepted.v1"],
      "retention": "limits",
      "storage": "file",
      "num_replicas": 1,
      "discard": "new",
      "max_bytes": {{ int64 .Values.jetstream.lifecycle.maxBytes }},
      "max_msgs": {{ .Values.jetstream.lifecycle.maxMessages }},
      "max_age": {{ mul .Values.jetstream.lifecycle.maxAgeSeconds 1000000000 }},
      "max_msg_size": 16384,
      "max_consumers": {{ .Values.jetstream.lifecycle.maxConsumers }},
      "duplicate_window": {{ mul .Values.jetstream.lifecycle.duplicateWindowSeconds 1000000000 }},
      "deny_delete": true,
      "deny_purge": true,
      "allow_rollup_hdrs": false
    }
{{- end -}}
{{- if .Values.jetstream.enabled }}
{{- if gt (int64 .Values.jetstream.lifecycle.maxBytes) (int64 .Values.jetstream.maxFileBytes) }}
{{- fail "jetstream.lifecycle.maxBytes must not exceed jetstream.maxFileBytes" }}
{{- end }}
{{- if gt (int64 .Values.jetstream.lifecycle.duplicateWindowSeconds) (int64 .Values.jetstream.lifecycle.maxAgeSeconds) }}
{{- fail "jetstream.lifecycle.duplicateWindowSeconds must not exceed maxAgeSeconds" }}
{{- end }}
{{ include "local.jetstreamConfig" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jetstream-data
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.jetstream.storageClassName }}
  storageClassName: {{ .Values.jetstream.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.jetstream.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: jetstream
spec:
  selector:
    app.kubernetes.io/name: jetstream
  ports:
    - {name: client, port: 4222, targetPort: client}
    {{- if .Values.observability.enabled }}
    - {name: metrics, port: 7777, targetPort: metrics}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jetstream
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
spec:
  serviceName: jetstream
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jetstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jetstream
      annotations:
        checksum/config: {{ include "local.jetstreamConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nats
          image: {{ .Values.jetstream.serverImage | quote }}
          args: ["--config=/config/nats.conf"]
          ports:
            - {name: client, containerPort: 4222}
          startupProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
          livenessProbe:
            tcpSocket: {port: client}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
        {{- if .Values.observability.enabled }}
        - name: exporter
          image: {{ .Values.jetstream.exporterImage | quote }}
          args: ["-varz", "-healthz", "-jsz=all", "http://127.0.0.1:8222"]
          ports:
            - {name: metrics, containerPort: 7777}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        {{- end }}
      volumes:
        - name: config
          configMap: {name: jetstream-config}
        - name: data
          persistentVolumeClaim: {claimName: jetstream-data}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jetstream-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jetstream
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              orchestrator.ayni.dev/jetstream-client: "true"
      ports: [{port: 4222, protocol: TCP}]
    {{- if .Values.observability.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports: [{port: 7777, protocol: TCP}]
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jetstream-provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 2
  template:
    metadata:
      labels:
        orchestrator.ayni.dev/jetstream-client: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provision
          workingDir: /tmp
          image: {{ .Values.jetstream.toolingImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export NATS_URL=nats://jetstream:4222
              for attempt in $(seq 1 60); do
                if nats --timeout=2s account info >/dev/null 2>&1; then break; fi
                sleep 2
              done
              # Only a successful listing establishes absence; outages must fail.
              nats stream ls --names > /tmp/streams
              if grep -qx ORCHESTRATOR_LIFECYCLE /tmp/streams; then
                nats stream edit ORCHESTRATOR_LIFECYCLE --config=/config/lifecycle.json --force
              else
                nats stream add --config=/config/lifecycle.json --defaults
              fi
              nats stream info ORCHESTRATOR_LIFECYCLE --json
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: jetstream-config}
        - name: scratch
          emptyDir: {sizeLimit: 16Mi}
{{- end }}
