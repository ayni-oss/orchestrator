apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-fixture
  template:
    metadata:
      labels:
        app: provider-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: node:24.14.0-alpine@sha256:7fddd9ddeae8196abf4a3ef2de34e11f7b1a722119f91f28ddf1e99dcafdf114
          command: [node, /fixture/server.mjs]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: source
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: provider-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: provider-fixture
spec:
  selector:
    app: provider-fixture
  ports:
    - port: 8080
      targetPort: 8080
