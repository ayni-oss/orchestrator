server_name: m1-feasibility
port: 4222
http: 8222
max_payload: 327680
max_connections: 64
max_pending: 16777216

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 0
  max_file_store: 1073741824
}

# Static fixture credentials are confined to the disposable feasibility network.
# Runtime deployments must provision unique retained executor credentials.
authorization {
  users: [
    {
      user: "workflow-admin"
      password: "admin-feasibility-only"
      permissions: { publish: ">", subscribe: ">" }
    },
    {
      user: "workflow-application"
      password: "application-feasibility-only"
      permissions: {
        publish: {
          allow: [
            "orchestrator.workflow.command.conversation.v1",
            "orchestrator.workflow.accepted.conversation.v1.*",
            "$JS.API.CONSUMER.INFO.ORCHESTRATOR_WORKFLOW_REPORT_V1.workflow-application",
            "$JS.API.CONSUMER.MSG.NEXT.ORCHESTRATOR_WORKFLOW_REPORT_V1.workflow-application",
            "$JS.ACK.ORCHESTRATOR_WORKFLOW_REPORT_V1.workflow-application.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    },
    {
      user: "workflow-executor-018f0f7b"
      password: "executor-feasibility-only"
      permissions: {
        publish: {
          allow: [
            "orchestrator.workflow.report.conversation.v1",
            "$JS.API.CONSUMER.INFO.ORCHESTRATOR_WORKFLOW_COMMAND_V1.scripted-executor",
            "$JS.API.CONSUMER.MSG.NEXT.ORCHESTRATOR_WORKFLOW_COMMAND_V1.scripted-executor",
            "$JS.ACK.ORCHESTRATOR_WORKFLOW_COMMAND_V1.scripted-executor.>",
            "$JS.API.CONSUMER.INFO.ORCHESTRATOR_WORKFLOW_DECISION_V1.executor-018f0f7b",
            "$JS.API.CONSUMER.MSG.NEXT.ORCHESTRATOR_WORKFLOW_DECISION_V1.executor-018f0f7b",
            "$JS.ACK.ORCHESTRATOR_WORKFLOW_DECISION_V1.executor-018f0f7b.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    },
    {
      user: "workflow-acceptance"
      password: "acceptance-feasibility-only"
      permissions: {
        publish: {
          allow: [
            "$JS.API.CONSUMER.INFO.ORCHESTRATOR_WORKFLOW_DECISION_V1.acceptance-harness",
            "$JS.API.CONSUMER.MSG.NEXT.ORCHESTRATOR_WORKFLOW_DECISION_V1.acceptance-harness",
            "$JS.ACK.ORCHESTRATOR_WORKFLOW_DECISION_V1.acceptance-harness.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
