syntax = "proto3";

package ayni.orchestrator.events.v1;

message ConversationTurnBinding {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string turn_id = 4;
  string assignment_id = 5;
  uint64 executor_generation = 6;
  string execution_binding_revision = 7;
  uint64 context_revision = 8;
  string command_event_id = 9;
  string command_digest = 10;
}

message ConversationContextRecord {
  string message_id = 1;
  uint64 sequence = 2;
  string role = 3;
  string content = 4;
}

// Application-issued workload identity; generations are fencing counters, not API versions.
message SessionExecutionScope {
  string session_id = 1;
  uint64 generation = 2;
  uint64 idle_timeout_seconds = 3;
}

message ConversationTurnRequested {
  ConversationTurnBinding binding = 1;
  string input_message_id = 2;
  string input_content = 3;
  repeated ConversationContextRecord context = 4;
  SessionExecutionScope session = 5;
  AgentExecutionConfiguration frozen_configuration = 6;
  ConversationContextManifest context_manifest = 7;
  ProjectStatusSnapshot project_status = 8;
}

enum ConversationTurnReportKind {
  CONVERSATION_TURN_REPORT_KIND_UNSPECIFIED = 0;
  CONVERSATION_TURN_REPORT_KIND_STARTED = 1;
  CONVERSATION_TURN_REPORT_KIND_COMPLETED = 2;
  CONVERSATION_TURN_REPORT_KIND_FAILED = 3;
}

message ConversationTurnReport {
  ConversationTurnBinding binding = 1;
  ConversationTurnReportKind kind = 2;
  uint64 report_sequence = 3;
  string executor_instance_id = 4;
  bytes signing_public_key = 5;
  string signing_key_digest = 6;
  string response_content = 7;
  // Closed safe classification code. Never raw executor or provider diagnostics.
  string failure_reason = 8;
  bytes signature = 9;
  ProviderCallEvidence provider_call = 10;
}

enum ConversationReportDecisionKind {
  CONVERSATION_REPORT_DECISION_KIND_UNSPECIFIED = 0;
  CONVERSATION_REPORT_DECISION_KIND_ACCEPTED = 1;
  CONVERSATION_REPORT_DECISION_KIND_REJECTED = 2;
}

message ConversationReportDecision {
  string report_source = 1;
  string report_id = 2;
  string report_digest = 3;
  string target_executor_instance_id = 4;
  string accepted_executor_instance_id = 5;
  string assignment_id = 6;
  uint64 executor_generation = 7;
  ConversationReportDecisionKind decision = 8;
  // Empty for acceptance. Rejection is one of: claim_lost, stale_generation,
  // wrong_scope, wrong_binding, invalid_signature, event_conflict, terminal_conflict.
  string safe_reason = 9;
  string turn_state = 10;
  string workspace_id = 11;
  string project_id = 12;
  string conversation_id = 13;
  string turn_id = 14;
}

// Exact immutable admission inputs; desired provider is not execution authority.
message AgentExecutionConfiguration {
  string revision_id = 1;
  string instructions = 2;
  string provider = 3;
  string model = 4;
  uint64 max_input_tokens = 5;
  uint64 max_output_tokens = 6;
  uint64 max_total_tokens = 7;
  uint64 idle_timeout_seconds = 8;
}

// Immutable eligibility-time history reference. Inline records may be only a tail.
message ConversationContextManifest {
  string id = 1;
  string digest = 2;
  uint64 record_count = 3;
  bool inline_complete = 4;
}

// Retained facts from one foreground call. Missing usage remains unknown.
message ProviderCallEvidence {
  string call_id = 1;
  string provider = 2;
  string model = 3;
  string configuration_revision_id = 4;
  string context_digest = 5;
  string request_digest = 6;
  string response_id = 7;
  string reported_model = 8;
  optional uint64 input_tokens = 9;
  optional uint64 output_tokens = 10;
  optional uint64 total_tokens = 11;
  uint64 reserved_input_tokens = 12;
  uint64 reserved_output_tokens = 13;
  uint64 reserved_total_tokens = 14;
  // completed, failed, uncertain or cancelled; never raw provider diagnostics.
  string state = 15;
  repeated ToolInvocationEvidence tool_invocations = 16;
}

// Factual project inputs frozen in the retained eligibility command.
message ProjectStatusSnapshot {
  string snapshot_id = 1;
  string project_id = 2;
  string objective = 3;
  // registered: a persisted project; does not assert objective completion.
  string status = 4;
  uint64 context_revision = 5;
  uint64 project_resource_version = 6;
}

// Safe metadata only. Arguments and output remain in the scoped worker ledger.
message ToolInvocationEvidence {
  string invocation_id = 1;
  string name = 2;
  string input_digest = 3;
  string output_digest = 4;
  string state = 5;
}
