syntax = "proto3";
package ayni.orchestrator.events.v1;

// Frozen logical and physical authority. A restarted writer receives a new generation.
message CodingExecutionBinding {
  string task_id = 1;
  string attempt_id = 2;
  string generation = 3;
  string execution_id = 4;
  string pod_uid = 5;
  string snapshot_digest = 6;
  string request_digest = 7;
}
enum CodingReportKind {
  CODING_REPORT_KIND_UNSPECIFIED = 0;
  CODING_REPORT_KIND_PROGRESS = 1;
  CODING_REPORT_KIND_FINAL = 2;
}
message CodingReportAvailable {
  CodingExecutionBinding binding = 1;
  CodingReportKind kind = 2;
  uint64 sequence = 3;
  string sha256 = 4;
  uint64 size_bytes = 5;
  string contract = 6;
}
message CodingDecisionRecorded {
  CodingReportAvailable observation = 1;
  string observation_source = 2;
  string observation_id = 3;
  uint64 aggregate_revision = 4;
  // Late/cancelled observations retain side effects without changing task outcome.
  bool applied = 5;
}
