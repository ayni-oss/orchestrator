syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/common.proto";
import "google/protobuf/timestamp.proto";

// RepositoryService manages provider-neutral repository connections and snapshots.
service RepositoryService {
  rpc ListRepositorySummaries(ListRepositorySummariesRequest) returns (ListRepositorySummariesResponse);
  rpc AnalyzeRepository(AnalyzeRepositoryRequest) returns (AnalyzeRepositoryResponse);
  rpc ListGithubInstallations(ListGithubInstallationsRequest) returns (ListGithubInstallationsResponse);
  rpc ListGithubInstallationRepositories(ListGithubInstallationRepositoriesRequest) returns (ListGithubInstallationRepositoriesResponse);
  rpc ConnectGithubRepository(ConnectGithubRepositoryRequest) returns (ConnectGithubRepositoryResponse);
  rpc ListRepositoryConnections(ListRepositoryConnectionsRequest) returns (ListRepositoryConnectionsResponse);
  rpc RemoveRepository(RemoveRepositoryRequest) returns (RemoveRepositoryResponse);
  rpc GetRepositoryConnection(GetRepositoryConnectionRequest) returns (GetRepositoryConnectionResponse);
  rpc CreateRepositoryConnection(CreateRepositoryConnectionRequest) returns (CreateRepositoryConnectionResponse);
  rpc ListRepositorySnapshots(ListRepositorySnapshotsRequest) returns (ListRepositorySnapshotsResponse);
  rpc GetRepositorySnapshot(GetRepositorySnapshotRequest) returns (GetRepositorySnapshotResponse);
  rpc SetRepositoryRegistry(SetRepositoryRegistryRequest) returns (SetRepositoryRegistryResponse);
  rpc WatchRepositories(WatchRepositoriesRequest) returns (stream WatchRepositoriesResponse);
}

message GithubInstallationOption {
  string installation_id = 1;
  string owner = 2;
  string app_name = 3;
}
message GithubRepositoryOption {
  string repository_id = 1;
  string owner = 2;
  string name = 3;
  string default_branch = 4;
}
message ListGithubInstallationsRequest {}
message ListGithubInstallationsResponse {
  repeated GithubInstallationOption installations = 1;
}
message ListGithubInstallationRepositoriesRequest {
  string installation_id = 1;
}
message ListGithubInstallationRepositoriesResponse {
  repeated GithubRepositoryOption repositories = 1;
}

// RepositoryConnectionStatus is the independently reconciled access state.
enum RepositoryConnectionStatus {
  REPOSITORY_CONNECTION_STATUS_UNSPECIFIED = 0;
  REPOSITORY_CONNECTION_STATUS_CONNECTING = 1;
  REPOSITORY_CONNECTION_STATUS_CONNECTED = 2;
  REPOSITORY_CONNECTION_STATUS_DEGRADED = 3;
  REPOSITORY_CONNECTION_STATUS_REVOKED = 4;
  REPOSITORY_CONNECTION_STATUS_FAILED = 5;
}

// RepositoryProvider identifies a repository at its provider boundary.
message RepositoryProvider {
  oneof provider {
    GithubRepository github = 1;
  }
}

// GithubRepository contains fields that are meaningful only for GitHub.
message GithubRepository {
  // repository_id is the provider's stable decimal repository identifier.
  string repository_id = 1;
  // owner and name are each 1 through 100 safe provider-name bytes.
  string owner = 2;
  string name = 3;
  uint64 installation_id = 4;
  // html_url is the canonical HTTPS repository URL, at most 2,048 bytes.
  string html_url = 5;
}

// RepositoryConnection is provider access configuration, not profile enrollment.
message RepositoryConnection {
  string id = 1;
  RepositoryProvider provider = 2;
  // display_name is 1 through 256 UTF-8 bytes.
  string display_name = 3;
  // default_branch is 1 through 255 safe provider-reference bytes.
  string default_branch = 4;
  RepositoryConnectionStatus status = 5;
  optional ResourceFailure failure = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // resource_version increases on every represented durable change.
  uint64 resource_version = 9;
  string registry_connection_id = 10;
  string image_namespace = 11;
  // Durable onboarding is independent from provider access.
  string onboarding_status = 12;
  string onboarding_reason = 13;
  string onboarding_revision = 14;
}

// RepositorySnapshot is an immutable observed repository revision.
message RepositorySnapshot {
  string id = 1;
  string repository_connection_id = 2;
  // revision is exactly 40 lowercase hexadecimal characters for the GitHub MVP.
  string revision = 3;
  // default_branch records the provider branch observed for this snapshot.
  string default_branch = 4;
  google.protobuf.Timestamp observed_at = 5;
  uint64 resource_version = 6;
}

message ListRepositoryConnectionsRequest {
  PageRequest page = 1;
  optional RepositoryConnectionStatus status = 2;
}

message ListRepositoryConnectionsResponse {
  repeated RepositoryConnection repository_connections = 1;
  PageResponse page = 2;
}

message GetRepositoryConnectionRequest {
  string repository_connection_id = 1;
}

message GetRepositoryConnectionResponse {
  RepositoryConnection repository_connection = 1;
}

message CreateRepositoryConnectionRequest {
  // idempotency_key is 1 through 128 ASCII [A-Za-z0-9._:-] characters.
  string idempotency_key = 1;
  RepositoryProvider provider = 2;
  string display_name = 3;
  string default_branch = 4;
  string registry_connection_id = 5;
  string image_namespace = 6;
}

message CreateRepositoryConnectionResponse {
  RepositoryConnection repository_connection = 1;
}

message ListRepositorySnapshotsRequest {
  string repository_connection_id = 1;
  PageRequest page = 2;
}

message ListRepositorySnapshotsResponse {
  repeated RepositorySnapshot repository_snapshots = 1;
  PageResponse page = 2;
}

message GetRepositorySnapshotRequest {
  string repository_snapshot_id = 1;
}

message GetRepositorySnapshotResponse {
  RepositorySnapshot repository_snapshot = 1;
}

message WatchRepositoriesRequest {
  // after_cursor resumes strictly after a previously delivered cursor. When absent,
  // the server emits current snapshots before waiting for later changes.
  optional uint64 after_cursor = 1;
  optional string repository_connection_id = 2;
}

message WatchRepositoriesResponse {
  // cursor is monotonic within RepositoryService and is safe to resume.
  uint64 cursor = 1;
  oneof update {
    RepositoryConnection repository_connection = 2;
    RepositorySnapshot repository_snapshot = 3;
    RepositoryRemoved repository_removed = 4;
  }
}

// Connect through the operator's existing GitHub App; identities are provider-observed.
message ConnectGithubRepositoryRequest {
  string idempotency_key = 1;
  string owner = 2;
  string name = 3;
  string registry_connection_id = 4;
  string image_namespace = 5;
}

message ConnectGithubRepositoryResponse {
  RepositoryConnection repository_connection = 1;
}

// Select a ready GHCR connection and its approved namespace for new runtime work.
message SetRepositoryRegistryRequest {
  string idempotency_key = 1;
  string repository_connection_id = 2;
  uint64 expected_resource_version = 3;
  string registry_connection_id = 4;
  string image_namespace = 5;
}
message SetRepositoryRegistryResponse {
  RepositoryConnection repository_connection = 1;
}

message AnalyzeRepositoryRequest {
  string repository_connection_id = 1;
  string idempotency_key = 2;
}
message AnalyzeRepositoryResponse {
  RepositoryConnection repository_connection = 1;
}

// Readiness is computed from every operational profile, never a sampled page.
// Unknown or incomplete data must not be represented as setup_required.
message RuntimeReadinessSummary {
  bool complete = 1;
  bool ready = 2;
  uint32 operational_profiles = 3;
  uint32 ready_profiles = 4;
}
message RepositorySummary {
  RepositoryConnection repository_connection = 1;
  RuntimeReadinessSummary runtime = 2;
}
message ListRepositorySummariesRequest {
  PageRequest page = 1;
}
message ListRepositorySummariesResponse {
  repeated RepositorySummary summaries = 1;
  PageResponse page = 2;
}

// Remove unused local onboarding and runtime configuration. Provider content is unchanged.
message RemoveRepositoryRequest {
  string idempotency_key = 1;
  string repository_connection_id = 2;
  uint64 expected_resource_version = 3;
}
message RemoveRepositoryResponse {}
message RepositoryRemoved {
  string repository_connection_id = 1;
}
