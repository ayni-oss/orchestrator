syntax = "proto3";
package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/development_tasks.proto";
import "google/protobuf/timestamp.proto";

// Trusted operator conversation API; not available on the custom-client listener.
service ProjectConversationService {
  rpc GetProjectConversationContext(GetProjectConversationContextRequest) returns (GetProjectConversationContextResponse);
  rpc ListProjectConversationHistory(ListProjectConversationHistoryRequest) returns (ListProjectConversationHistoryResponse);
  rpc WatchProjectConversation(WatchProjectConversationRequest) returns (stream WatchProjectConversationResponse);
  rpc CreateProjectConversation(CreateProjectConversationRequest) returns (CreateProjectConversationResponse);
  rpc ListProjectConversations(ListProjectConversationsRequest) returns (ListProjectConversationsResponse);
  rpc GetProjectConversation(GetProjectConversationRequest) returns (GetProjectConversationResponse);
  rpc SendProjectMessage(SendProjectMessageRequest) returns (SendProjectMessageResponse);
  rpc DecideProjectPlan(DecideProjectPlanRequest) returns (DecideProjectPlanResponse);
  rpc DecideProjectProposal(DecideProjectProposalRequest) returns (DecideProjectProposalResponse);
}
message ProjectConversation {
  string id = 1;
  string project_id = 2;
  string title = 3;
  repeated string repository_connection_ids = 4;
  repeated ProjectMessage messages = 5;
  repeated ProjectAgentRun runs = 6;
  repeated ProjectTaskProposal proposals = 7;
  uint64 update_cursor = 8;
  google.protobuf.Timestamp created_at = 9;
  ProjectPlan plan = 10;
}
message ProjectMessage {
  string id = 1;
  string role = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
  string run_id = 5;
}
message ProjectAgentRun {
  string id = 1;
  string state = 2;
  string model = 3;
  string connection_id = 4;
  string credential_revision = 5;
  uint32 model_calls = 6;
  string failure = 7;
  google.protobuf.Timestamp created_at = 8;
  FrozenProviderCredentials provider_credentials = 9;
  string purpose = 10;
  ProviderTokenUsage token_usage = 11;
}
message ProjectTaskProposal {
  string id = 1;
  string run_id = 2;
  string state = 3;
  DevelopmentTaskRequest request = 4;
  string task_id = 5;
  string attempt_id = 6;
  string failure = 7;
  // create_task, cancel_task, retry_task, retry_publication.
  string action = 8;
  string target_task_id = 9;
  FrozenRuntime researched_runtime = 10;
}
message CreateProjectConversationRequest {
  string idempotency_key = 1;
  string project_id = 2;
  string title = 3;
  repeated string repository_connection_ids = 4;
}
message WatchProjectConversationResponse {
  ProjectConversation conversation = 1;
}
message CreateProjectConversationResponse {
  ProjectConversation conversation = 1;
}
message GetProjectConversationResponse {
  ProjectConversation conversation = 1;
}
message SendProjectMessageResponse {
  ProjectConversation conversation = 1;
}
message DecideProjectProposalResponse {
  ProjectConversation conversation = 1;
}
message ListProjectConversationsRequest {
  string project_id = 1;
}
message ListProjectConversationsResponse {
  repeated ProjectConversation conversations = 1;
}
message GetProjectConversationRequest {
  string conversation_id = 1;
}
message SendProjectMessageRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string content = 3;
}
message DecideProjectProposalRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string proposal_id = 3;
  // approve, reject, revise. Revisions are supplied as a new user message.
  string decision = 4;
}

message WatchProjectConversationRequest {
  string conversation_id = 1;
  uint64 after_cursor = 2;
}

// Stable identity with append-only research snapshots. Approval admits the entire
// reviewed version; lifecycle actions remain separate proposal confirmations.
message ProjectPlan {
  string id = 1;
  repeated ProjectPlanVersion versions = 2;
}
message ProjectPlanVersion {
  uint64 version = 1;
  string run_id = 2;
  string state = 3;
  string findings = 4;
  string scope = 5;
  repeated string acceptance_criteria = 6;
  repeated string proposal_ids = 7;
  // Descriptive research only; this grants no environment change authority.
  string dependency_environment_impact = 8;
  google.protobuf.Timestamp created_at = 9;
  string failure = 10;
}
message DecideProjectPlanRequest {
  string idempotency_key = 1;
  string conversation_id = 2;
  string plan_id = 3;
  uint64 version = 4;
  // approve, reject, revise. Revisions are supplied as a new user message.
  string decision = 5;
}
message DecideProjectPlanResponse {
  ProjectConversation conversation = 1;
}

// Archive records are immutable safe projections, scoped to one conversation.
message ProjectContextRecord {
  uint64 sequence = 1;
  string id = 2;
  string kind = 3;
  string source_id = 4;
  string repository_id = 5;
  string role = 6;
  string content = 7;
}
message ProjectConversationSummary {
  uint64 version = 1;
  uint64 source_watermark = 2;
  string content = 3;
  repeated string source_record_ids = 4;
}
message GetProjectConversationContextRequest {
  string project_id = 1;
  string conversation_id = 2;
}
message GetProjectConversationContextResponse {
  ProjectConversationSummary summary = 1;
  uint64 source_watermark = 2;
  uint64 archive_record_count = 3;
  uint64 capacity_record_limit = 4;
  uint32 recent_message_limit = 5;
}
message ListProjectConversationHistoryRequest {
  string project_id = 1;
  string conversation_id = 2;
  uint64 before_sequence = 3;
  uint64 snapshot_sequence = 4;
  string query = 5;
  uint32 limit = 6;
}
message ListProjectConversationHistoryResponse {
  repeated ProjectContextRecord records = 1;
  uint64 snapshot_sequence = 2;
  uint64 next_before_sequence = 3;
  bool has_more = 4;
  uint64 archive_record_count = 5;
}
