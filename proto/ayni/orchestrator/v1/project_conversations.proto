syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/workflow.proto";

// M1 exposes only the durable conversation path on the trusted operator listener.
service ProjectConversationService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetConversationSnapshot(GetConversationSnapshotRequest) returns (GetConversationSnapshotResponse);
  rpc ListConversationHistory(ListConversationHistoryRequest) returns (ListConversationHistoryResponse);
  rpc WatchConversation(WatchConversationRequest) returns (stream WatchConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
}

message CreateConversationRequest {
  string idempotency_key = 1;
  string workspace_id = 2;
  string project_id = 3;
  string title = 4;
}

message CreateConversationResponse {
  Conversation conversation = 1;
  CommandReceipt receipt = 2;
}

message SendMessageRequest {
  string idempotency_key = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  string content = 5;
}

message SendMessageResponse {
  CommandReceipt receipt = 1;
}

message GetConversationSnapshotRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
}

message GetConversationSnapshotResponse {
  ConversationSnapshot snapshot = 1;
}

message ListConversationHistoryRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string snapshot_id = 4;
  uint64 before_sequence = 5;
  uint32 limit = 6;
}

message ListConversationHistoryResponse {
  repeated ConversationHistoryRecord records = 1;
  string snapshot_id = 2;
  uint64 next_before_sequence = 3;
  bool has_more = 4;
}

message WatchConversationRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  optional string after_cursor = 4;
}

message WatchConversationResponse {
  oneof frame {
    ConversationSnapshot snapshot = 1;
    ConversationUpdate update = 2;
    ConversationWatchHeartbeat heartbeat = 3;
  }
}

// Live ID-ordered keyset discovery within one project. Limit defaults to 50,
// is at most 100, and does not provide a frozen catalog snapshot.
message ListConversationsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string after_id = 3;
  uint32 limit = 4;
}
message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_after_id = 2;
}
