syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/plans.proto";
import "ayni/orchestrator/v1/workflow.proto";

// Scoped conversation execution and operator plan review on the trusted listener.
service ProjectConversationService {
  rpc StartTaskPublication(StartTaskPublicationRequest) returns (StartTaskPublicationResponse);
  rpc CancelTaskPublication(CancelTaskPublicationRequest) returns (CancelTaskPublicationResponse);
  rpc StartTaskExecution(StartTaskExecutionRequest) returns (StartTaskExecutionResponse);
  rpc CancelTaskExecution(CancelTaskExecutionRequest) returns (CancelTaskExecutionResponse);
  rpc GetTaskAttempt(GetTaskAttemptRequest) returns (GetTaskAttemptResponse);
  rpc PrepareTaskExecution(PrepareTaskExecutionRequest) returns (PrepareTaskExecutionResponse);
  rpc GetTaskExecution(GetTaskExecutionRequest) returns (GetTaskExecutionResponse);
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);
  rpc GetPlanApproval(GetPlanApprovalRequest) returns (GetPlanApprovalResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ConfirmTaskRecovery(ConfirmTaskRecoveryRequest) returns (ConfirmTaskRecoveryResponse);
  rpc RecordTaskRecovery(RecordTaskRecoveryRequest) returns (RecordTaskRecoveryResponse);
  rpc ListTaskRecovery(ListTaskRecoveryRequest) returns (ListTaskRecoveryResponse);
  rpc ListTaskFeedback(ListTaskFeedbackRequest) returns (ListTaskFeedbackResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  rpc RevisePlan(RevisePlanRequest) returns (RevisePlanResponse);
  rpc GetPlanVersion(GetPlanVersionRequest) returns (GetPlanVersionResponse);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc ListPlanVersions(ListPlanVersionsRequest) returns (ListPlanVersionsResponse);
  rpc ListProviderCalls(ListProviderCallsRequest) returns (ListProviderCallsResponse);
  rpc AcknowledgeProviderUncertainty(AcknowledgeProviderUncertaintyRequest) returns (AcknowledgeProviderUncertaintyResponse);
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetConversationSnapshot(GetConversationSnapshotRequest) returns (GetConversationSnapshotResponse);
  rpc ListConversationHistory(ListConversationHistoryRequest) returns (ListConversationHistoryResponse);
  rpc WatchConversation(WatchConversationRequest) returns (stream WatchConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListConversationSessions(ListConversationSessionsRequest) returns (ListConversationSessionsResponse);
  rpc ReplaceConversationSession(ReplaceConversationSessionRequest) returns (ReplaceConversationSessionResponse);
}

message CreateConversationRequest {
  string idempotency_key = 1;
  string workspace_id = 2;
  string project_id = 3;
  string title = 4;
}

message CreateConversationResponse {
  Conversation conversation = 1;
  CommandReceipt receipt = 2;
}

message SendMessageRequest {
  string idempotency_key = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  string content = 5;
}

message SendMessageResponse {
  CommandReceipt receipt = 1;
}

message GetConversationSnapshotRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
}

message GetConversationSnapshotResponse {
  ConversationSnapshot snapshot = 1;
}

message ListConversationHistoryRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string snapshot_id = 4;
  uint64 before_sequence = 5;
  uint32 limit = 6;
}

message ListConversationHistoryResponse {
  repeated ConversationHistoryRecord records = 1;
  string snapshot_id = 2;
  uint64 next_before_sequence = 3;
  bool has_more = 4;
}

message WatchConversationRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  optional string after_cursor = 4;
}

message WatchConversationResponse {
  oneof frame {
    ConversationSnapshot snapshot = 1;
    ConversationUpdate update = 2;
    ConversationWatchHeartbeat heartbeat = 3;
  }
}

// Live ID-ordered keyset discovery within one project. Limit defaults to 50,
// is at most 100, and does not provide a frozen catalog snapshot.
message ListConversationsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string after_id = 3;
  uint32 limit = 4;
}
message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_after_id = 2;
}

// A generation fences stale executors; it is not an interface version.
message ConversationSession {
  string id = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  uint64 generation = 5;
  string state = 6;
  uint64 idle_timeout_seconds = 7;
  // Advisory readiness; replacement still checks generation and retained work atomically.
  bool can_replace = 8;
}
message ListConversationSessionsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
}
message ListConversationSessionsResponse {
  repeated ConversationSession sessions = 1;
}
// Replacement is allowed only after accepted work and handoffs have settled.
// Ambiguous retries retain both the idempotency key and expected generation.
message ReplaceConversationSessionRequest {
  string idempotency_key = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  uint64 expected_generation = 5;
}
message ReplaceConversationSessionResponse {
  ConversationSession session = 1;
}

message ListProviderCallsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
}
message ProviderCall {
  string turn_id = 1;
  string call_id = 2;
  string provider = 3;
  string model = 4;
  string state = 5;
  optional uint64 input_tokens = 6;
  optional uint64 output_tokens = 7;
  optional uint64 total_tokens = 8;
  uint64 reserved_input_tokens = 9;
  uint64 reserved_output_tokens = 10;
  uint64 reserved_total_tokens = 11;
  bool cancellation_requested = 12;
  string safe_reason = 13;
  string response_id = 14;
  string reported_model = 15;
  string request_digest = 16;
  string context_digest = 17;
  string configuration_revision_id = 18;
  repeated ToolInvocation tool_invocations = 19;
  bool uncertainty_acknowledged = 20;
}
message ListProviderCallsResponse {
  repeated ProviderCall calls = 1;
}
message CancelTurnRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string turn_id = 4;
  string idempotency_key = 5;
}
message CancelTurnResponse {
  string command_id = 1;
  string turn_id = 2;
  string state = 3;
  bool cancellation_requested = 4;
}

// Allowlisted activity metadata; never tool arguments or raw output.
message ToolInvocation {
  string invocation_id = 1;
  string name = 2;
  string input_digest = 3;
  string output_digest = 4;
  string state = 5;
}

// Explicitly retire an unresolved call without inventing usage or resending it.
message AcknowledgeProviderUncertaintyRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string turn_id = 4;
  string call_id = 5;
  string request_digest = 6;
  string idempotency_key = 7;
  bool acknowledge_possible_charge = 8;
}
message AcknowledgeProviderUncertaintyResponse {
  string command_id = 1;
  string turn_id = 2;
  string call_id = 3;
  string state = 4;
}
