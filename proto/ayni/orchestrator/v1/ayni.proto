syntax = "proto3";
package ayni.orchestrator.v1;

// Trusted operator API; absent from the custom-client listener.
service AyniService {
  rpc StartBuilderInstallation(StartBuilderInstallationRequest) returns (StartBuilderInstallationResponse);
  rpc GetBuilderInstallation(GetBuilderInstallationRequest) returns (GetBuilderInstallationResponse);
  rpc CancelBuilderInstallation(CancelBuilderInstallationRequest) returns (CancelBuilderInstallationResponse);
  rpc ListAyniReleases(ListAyniReleasesRequest) returns (ListAyniReleasesResponse);
  rpc GetBuildService(GetBuildServiceRequest) returns (GetBuildServiceResponse);
  rpc UpdateBuildService(UpdateBuildServiceRequest) returns (UpdateBuildServiceResponse);
  rpc TestBuildService(TestBuildServiceRequest) returns (TestBuildServiceResponse);
  rpc CancelBuildServiceTest(CancelBuildServiceTestRequest) returns (CancelBuildServiceTestResponse);
}
message AyniRelease {
  string version = 1;
  string tag = 2;
  string published_at = 3;
  string url = 4;
  bool supported = 5;
}
message ListAyniReleasesRequest {
  uint32 page = 1;
}
message ListAyniReleasesResponse {
  repeated AyniRelease releases = 1;
  uint32 next_page = 2;
  bool cached = 3;
  string discovery_status = 4;
  string supported_version = 5;
}
message GetBuildServiceRequest {}
// Safe metadata and Secret references only; no credentials.
message BuildServiceSettings {
  uint64 resource_version = 1;
  string ayni_version = 2;
  string builder_image = 3;
  string engine_image = 4;
  string platform = 5;
  string security_mode = 6;
  string status = 7;
  string failure_reason = 8;
  string management_source = 9;
  string test_id = 10;
  uint64 tested_revision = 11;
  string test_registry_id = 12;
  string test_certificate_id = 13;
  string provisioning_base = 14;
  reserved 15;
  reserved "network_policy_verified";
  string engine_host = 16;
  string engine_secret = 17;
  BuilderInstallation installation = 18;
}
message UpdateBuildServiceRequest {
  string idempotency_key = 1;
  uint64 expected_resource_version = 2;
  BuildServiceSettings settings = 3;
}
message TestBuildServiceRequest {
  string idempotency_key = 1;
  uint64 expected_resource_version = 2;
}

message GetBuildServiceResponse {
  BuildServiceSettings settings = 1;
}
message UpdateBuildServiceResponse {
  BuildServiceSettings settings = 1;
}
message TestBuildServiceResponse {
  BuildServiceSettings settings = 1;
}

message CancelBuildServiceTestRequest {
  string idempotency_key = 1;
  uint64 expected_resource_version = 2;
}
message CancelBuildServiceTestResponse {
  BuildServiceSettings settings = 1;
}

message BuilderInstallation {
  string id = 1;
  uint64 configuration_revision = 2;
  string ayni_version = 3;
  string platform = 4;
  string status = 5;
  string stage = 6;
  string image_tag = 7;
  string image_digest = 8;
  string recipe_identity = 9;
  string failure_reason = 10;
  uint32 retry_count = 11;
}
message StartBuilderInstallationRequest {
  string idempotency_key = 1;
  uint64 expected_resource_version = 2;
}
message StartBuilderInstallationResponse {
  BuildServiceSettings settings = 1;
}
message GetBuilderInstallationRequest {}
message GetBuilderInstallationResponse {
  BuilderInstallation installation = 1;
}
message CancelBuilderInstallationRequest {
  string idempotency_key = 1;
  uint64 expected_resource_version = 2;
}
message CancelBuilderInstallationResponse {
  BuildServiceSettings settings = 1;
}
