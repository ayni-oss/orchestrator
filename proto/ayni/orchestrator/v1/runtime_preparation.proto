syntax = "proto3";
package ayni.orchestrator.v1;

// Trusted local-operator setup for separate runtime preparation capabilities.
service RuntimePreparationService {
  rpc StartRepositoryRuntime(StartRepositoryRuntimeRequest) returns (StartRepositoryRuntimeResponse);
  rpc GetRepositoryRuntime(GetRepositoryRuntimeRequest) returns (GetRepositoryRuntimeResponse);
  rpc GetRepositoryRuntimeReceipt(GetRepositoryRuntimeReceiptRequest) returns (GetRepositoryRuntimeReceiptResponse);
  rpc ProvisionRuntimeSigner(ProvisionRuntimeSignerRequest) returns (ProvisionRuntimeSignerResponse);
  rpc RecoverRuntimeSignerProvisioning(RecoverRuntimeSignerProvisioningRequest) returns (RecoverRuntimeSignerProvisioningResponse);
  rpc SaveRuntimeSigner(SaveRuntimeSignerRequest) returns (SaveRuntimeSignerResponse);
  rpc SetRuntimeSignerEnabled(SetRuntimeSignerEnabledRequest) returns (SetRuntimeSignerEnabledResponse);
  rpc ListRuntimeSigners(ListRuntimeSignersRequest) returns (ListRuntimeSignersResponse);
  rpc GetRuntimeSignerReceipt(GetRuntimeSignerReceiptRequest) returns (GetRuntimeSignerReceiptResponse);
  rpc StartRuntimePreparation(StartRuntimePreparationRequest) returns (StartRuntimePreparationResponse);
  rpc GetRuntimePreparation(GetRuntimePreparationRequest) returns (GetRuntimePreparationResponse);
  rpc ListRuntimePreparations(ListRuntimePreparationsRequest) returns (ListRuntimePreparationsResponse);
  rpc GetRuntimePreparationReceipt(GetRuntimePreparationReceiptRequest) returns (GetRuntimePreparationReceiptResponse);
  rpc CancelRuntimePreparation(CancelRuntimePreparationRequest) returns (CancelRuntimePreparationResponse);
  rpc RetryRuntimePreparation(RetryRuntimePreparationRequest) returns (RetryRuntimePreparationResponse);
}
// Public configuration only. The referenced immutable Secret is administrator-owned.
message RuntimeSigner {
  string id = 1;
  string display_name = 2;
  string key_id = 3;
  string public_key = 4;
  string secret_name = 5;
  string secret_uid = 6;
  string active_revision = 7;
  uint64 revision = 8;
  bool enabled = 9;
}
message SaveRuntimeSignerRequest {
  string idempotency_key = 1;
  string id = 2;
  uint64 expected_revision = 3;
  string display_name = 4;
  string key_id = 5;
  string public_key = 6;
  string secret_name = 7;
  string secret_uid = 8;
}
message SaveRuntimeSignerResponse {
  RuntimeSigner signer = 1;
}
message SetRuntimeSignerEnabledRequest {
  string idempotency_key = 1;
  string id = 2;
  uint64 expected_revision = 3;
  bool enabled = 4;
}
message SetRuntimeSignerEnabledResponse {
  RuntimeSigner signer = 1;
}
message ListRuntimeSignersRequest {
  string after_id = 1;
  uint32 limit = 2;
}
message ListRuntimeSignersResponse {
  repeated RuntimeSigner signers = 1;
  string next_after_id = 2;
}
message GetRuntimeSignerReceiptRequest {
  string idempotency_key = 1;
}
message GetRuntimeSignerReceiptResponse {
  RuntimeSigner signer = 1;
}

// Public metadata/evidence only; source bytes and credential values never appear here.
message RuntimePreparation {
  string id = 1;
  string idempotency_key = 2;
  string repository_id = 3;
  string inspection_id = 4;
  string registry_connection_id = 5;
  string signer_id = 6;
  string platform = 7;
  string state = 8;
  string stage = 9;
  string safe_reason = 10;
  uint64 generation = 11;
  bool allow_build = 12;
  bool allow_replace = 13;
  uint32 max_builds = 14;
  uint32 builds_started = 15;
  uint64 deadline_unix_ms = 16;
  string frozen_input_digest = 17;
  string image_digest = 18;
  string candidate_image = 19;
  string protected_content_root = 20;
  string certificate_digest = 21;
  bool content_verified = 22;
  bool managed_compatible = 23;
  bool cleanup_complete = 24;
  uint64 accepted_at_unix_ms = 25;
  uint64 updated_at_unix_ms = 26;
  string expected_manifest_digest = 27;
  string source_commit = 28;
  string source_tree = 29;
  string policy_digest = 30;
  string lock_digest = 31;
  string lock_fingerprint = 32;
  string registry_destination = 33;
  string managed_check_digest = 34;
  string unsigned_manifest_digest = 35;
  string certification_layer_digest = 36;
  // Local development opt-in; does not establish cluster/network qualification.
  bool development_only = 37;
}
message StartRuntimePreparationRequest {
  string idempotency_key = 1;
  string repository_id = 2;
  string inspection_id = 3;
  string registry_connection_id = 4;
  string signer_id = 5;
  string platform = 6;
  uint32 max_seconds = 7;
  uint32 max_builds = 8;
  bool allow_build = 9;
  bool allow_replace = 10;
}
message StartRuntimePreparationResponse {
  RuntimePreparation operation = 1;
}
message GetRuntimePreparationRequest {
  string id = 1;
}
message GetRuntimePreparationResponse {
  RuntimePreparation operation = 1;
}
message ListRuntimePreparationsRequest {
  string repository_id = 1;
  string after_id = 2;
  uint32 limit = 3;
}
message ListRuntimePreparationsResponse {
  repeated RuntimePreparation operations = 1;
  string next_after_id = 2;
}
message GetRuntimePreparationReceiptRequest {
  string idempotency_key = 1;
}
message GetRuntimePreparationReceiptResponse {
  RuntimePreparation operation = 1;
}
message CancelRuntimePreparationRequest {
  string idempotency_key = 1;
  string id = 2;
  uint64 expected_generation = 3;
}
message CancelRuntimePreparationResponse {
  RuntimePreparation operation = 1;
}
message RetryRuntimePreparationRequest {
  string idempotency_key = 1;
  string id = 2;
  uint64 expected_generation = 3;
}
message RetryRuntimePreparationResponse {
  RuntimePreparation operation = 1;
}

// Private seed is an upload only; responses and retained intents contain public identity.
message ProvisionRuntimeSignerRequest {
  string idempotency_key = 1;
  string display_name = 2;
  string key_id = 3;
  string mode = 4;
  string signing_seed = 5;
}
message RecoverRuntimeSignerProvisioningRequest {
  string idempotency_key = 1;
}
message RuntimeSignerProvisioningOperation {
  string id = 1;
  string idempotency_key = 2;
  string display_name = 3;
  string key_id = 4;
  string mode = 5;
  string state = 6;
  string safe_reason = 7;
  string public_key = 8;
  string secret_name = 9;
  string secret_uid = 10;
  string signer_id = 11;
  uint64 accepted_at_unix_ms = 12;
  uint64 updated_at_unix_ms = 13;
}
message ProvisionRuntimeSignerResponse {
  RuntimeSignerProvisioningOperation operation = 1;
  RuntimeSigner signer = 2;
}

message RecoverRuntimeSignerProvisioningResponse {
  RuntimeSignerProvisioningOperation operation = 1;
  RuntimeSigner signer = 2;
}

// One reviewed onboarding run. It resolves the latest default branch once, then
// retains exact inspection/preparation keys. No recurring or unbounded build grant.
message StartRepositoryRuntimeRequest {
  string idempotency_key = 1;
  string repository_id = 2;
  uint64 expected_connection_revision = 3;
  string registry_connection_id = 4;
  string signer_id = 5;
  string platform = 6;
  uint32 max_seconds = 7;
  uint32 max_builds = 8;
  bool allow_build = 9;
  bool allow_replace = 10;
}
message RepositoryRuntimeRun {
  string id = 1;
  string idempotency_key = 2;
  StartRepositoryRuntimeRequest settings = 3;
  string state = 4;
  string safe_reason = 5;
  string commit_sha = 6;
  string inspection_id = 7;
  string preparation_id = 8;
}
message StartRepositoryRuntimeResponse {
  RepositoryRuntimeRun run = 1;
}
message GetRepositoryRuntimeRequest {
  string repository_id = 1;
}
message GetRepositoryRuntimeResponse {
  RepositoryRuntimeRun run = 1;
  // Deployment configuration, independent of the retained last-run outcome.
  bool preparation_enabled = 2;
  bool development_only = 3;
}
message GetRepositoryRuntimeReceiptRequest {
  string idempotency_key = 1;
}

message GetRepositoryRuntimeReceiptResponse {
  RepositoryRuntimeRun run = 1;
}
