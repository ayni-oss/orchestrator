syntax = "proto3";
package ayni.orchestrator.v1;

// Trusted local-operator setup for separate runtime preparation capabilities.
service RuntimePreparationService {
  rpc SaveRuntimeSigner(SaveRuntimeSignerRequest) returns (SaveRuntimeSignerResponse);
  rpc SetRuntimeSignerEnabled(SetRuntimeSignerEnabledRequest) returns (SetRuntimeSignerEnabledResponse);
  rpc ListRuntimeSigners(ListRuntimeSignersRequest) returns (ListRuntimeSignersResponse);
  rpc GetRuntimeSignerReceipt(GetRuntimeSignerReceiptRequest) returns (GetRuntimeSignerReceiptResponse);
}
// Public configuration only. The referenced immutable Secret is administrator-owned.
message RuntimeSigner {
  string id = 1;
  string display_name = 2;
  string key_id = 3;
  string public_key = 4;
  string secret_name = 5;
  string secret_uid = 6;
  string active_revision = 7;
  uint64 revision = 8;
  bool enabled = 9;
}
message SaveRuntimeSignerRequest {
  string idempotency_key = 1;
  string id = 2;
  uint64 expected_revision = 3;
  string display_name = 4;
  string key_id = 5;
  string public_key = 6;
  string secret_name = 7;
  string secret_uid = 8;
}
message SaveRuntimeSignerResponse {
  RuntimeSigner signer = 1;
}
message SetRuntimeSignerEnabledRequest {
  string idempotency_key = 1;
  string id = 2;
  uint64 expected_revision = 3;
  bool enabled = 4;
}
message SetRuntimeSignerEnabledResponse {
  RuntimeSigner signer = 1;
}
message ListRuntimeSignersRequest {
  string after_id = 1;
  uint32 limit = 2;
}
message ListRuntimeSignersResponse {
  repeated RuntimeSigner signers = 1;
  string next_after_id = 2;
}
message GetRuntimeSignerReceiptRequest {
  string idempotency_key = 1;
}
message GetRuntimeSignerReceiptResponse {
  RuntimeSigner signer = 1;
}
