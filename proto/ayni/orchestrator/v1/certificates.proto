syntax = "proto3";
package ayni.orchestrator.v1;

// Trusted operator API; never exposed on the custom-client listener.
service CertificateService {
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);
  rpc GetCertificate(GetCertificateRequest) returns (GetCertificateResponse);
  rpc CreateCertificate(CreateCertificateRequest) returns (CreateCertificateResponse);
  rpc ReplaceCertificate(ReplaceCertificateRequest) returns (ReplaceCertificateResponse);
  rpc RenameCertificate(RenameCertificateRequest) returns (RenameCertificateResponse);
  rpc SetCertificateEnabled(SetCertificateEnabledRequest) returns (SetCertificateEnabledResponse);
  rpc SetDefaultCertificate(SetDefaultCertificateRequest) returns (SetDefaultCertificateResponse);
  rpc DeleteCertificate(DeleteCertificateRequest) returns (DeleteCertificateResponse);
}
// Safe metadata only. The private seed is never returned.
message Certificate {
  string id = 1;
  string management_source = 2;
  string display_name = 3;
  string key_id = 4;
  string public_key = 5;
  string secret_name = 6;
  string secret_uid = 7;
  string revision = 8;
  bool enabled = 9;
  bool is_default = 10;
  uint64 resource_version = 11;
  string status = 12;
  string failure_reason = 13;
  string source_secret_name = 14;
  string source_secret_uid = 15;
  string source_revision = 16;
  repeated CertificateSecretRevision retired_secret_revisions = 17;
  uint64 usage_count = 18;
}
message CertificateSecretRevision {
  string secret_name = 1;
  string secret_uid = 2;
}
message ListCertificatesRequest {}
message ListCertificatesResponse {
  repeated Certificate certificates = 1;
}
message GetCertificateRequest {
  string id = 1;
}
message GetCertificateResponse {
  Certificate certificate = 1;
}
// Write-only seed. Never persist, log, or reflect this request.
message CreateCertificateRequest {
  string idempotency_key = 1;
  string display_name = 2;
  string key_id = 3;
  string signing_seed = 4;
  bool generate = 5;
}
message CreateCertificateResponse {
  Certificate certificate = 1;
}
message ReplaceCertificateRequest {
  string id = 1;
  string idempotency_key = 2;
  uint64 expected_resource_version = 3;
  string key_id = 4;
  string signing_seed = 5;
  bool generate = 6;
}
message ReplaceCertificateResponse {
  Certificate certificate = 1;
}
message RenameCertificateRequest {
  string id = 1;
  string idempotency_key = 2;
  uint64 expected_resource_version = 3;
  string display_name = 4;
}
message RenameCertificateResponse {
  Certificate certificate = 1;
}
message SetCertificateEnabledRequest {
  string id = 1;
  string idempotency_key = 2;
  uint64 expected_resource_version = 3;
  bool enabled = 4;
}
message SetCertificateEnabledResponse {
  Certificate certificate = 1;
}
message SetDefaultCertificateRequest {
  string id = 1;
  string idempotency_key = 2;
  uint64 expected_resource_version = 3;
}
message SetDefaultCertificateResponse {
  Certificate certificate = 1;
}
message DeleteCertificateRequest {
  string id = 1;
  string idempotency_key = 2;
  uint64 expected_resource_version = 3;
}
message DeleteCertificateResponse {}
