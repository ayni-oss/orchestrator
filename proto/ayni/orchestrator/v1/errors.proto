syntax = "proto3";

package ayni.orchestrator.v1;

// ErrorReason is a stable machine-readable refinement of canonical gRPC status.
enum ErrorReason {
  reserved 3, 5, 7 to 11, 13 to 24, 25 to 28, 31;
  reserved "ERROR_REASON_IDEMPOTENCY_KEY_REUSED", "ERROR_REASON_CONFLICT";
  reserved "ERROR_REASON_PROVIDER_UNAVAILABLE", "ERROR_REASON_MODEL_UNAVAILABLE";
  reserved "ERROR_REASON_REPOSITORY_ACCESS", "ERROR_REASON_CANCELLED";
  reserved "ERROR_REASON_DEADLINE_EXCEEDED", "ERROR_REASON_INVALID_REPOSITORY_REVISION";
  reserved "ERROR_REASON_INVALID_PROFILE_REVISION", "ERROR_REASON_INVALID_LOCK_FINGERPRINT";
  reserved "ERROR_REASON_INVALID_OCI_REFERENCE", "ERROR_REASON_INVALID_OCI_DIGEST";
  reserved "ERROR_REASON_INVALID_PLATFORM", "ERROR_REASON_PROFILE_UNSUPPORTED";
  reserved "ERROR_REASON_PROFILE_NOT_READY", "ERROR_REASON_RUNTIME_ARTIFACT_NOT_VERIFIED";
  reserved "ERROR_REASON_AUTOMATION_NOT_READY", "ERROR_REASON_TASK_NOT_ACTIONABLE";
  reserved "ERROR_REASON_TASK_DEADLINE_EXPIRED", "ERROR_REASON_UNKNOWN_ENUM_VALUE";

  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_IDENTIFIER = 1;
  ERROR_REASON_INVALID_INPUT = 2;
  ERROR_REASON_RESOURCE_NOT_FOUND = 4;
  ERROR_REASON_FAILED_PRECONDITION = 6;
  ERROR_REASON_INTERNAL = 12;
  ERROR_REASON_BOUND_EXCEEDED = 29;
  ERROR_REASON_WATCH_CURSOR_EXPIRED = 30;
  ERROR_REASON_NOT_IMPLEMENTED = 32;
  ERROR_REASON_IDEMPOTENCY_CONFLICT = 33;
  ERROR_REASON_HISTORY_SNAPSHOT_EXPIRED = 34;
  ERROR_REASON_PLAN_VERSION_CONFLICT = 35;
  ERROR_REASON_PLAN_ALREADY_APPROVED = 36;
  ERROR_REASON_PLAN_DIGEST_MISMATCH = 37;
  ERROR_REASON_PLAN_UNRESOLVED_SCOPE = 38;
}

// ErrorDetail is packed into the standard rich gRPC status details list.
message ErrorDetail {
  ErrorReason reason = 1;
  // message is a credential-free explanation of at most 512 UTF-8 bytes.
  string message = 2;
  // resource_type is a documented identifier of at most 64 ASCII bytes.
  optional string resource_type = 3;
  // resource_id is at most 512 UTF-8 bytes.
  optional string resource_id = 4;
  // metadata contains at most 16 documented key/value entries.
  repeated ErrorMetadata metadata = 5;
  // request_id is the accepted correlation metadata value, at most 64 ASCII bytes.
  optional string request_id = 6;
}

// ErrorMetadata carries one bounded, non-secret error attribute.
message ErrorMetadata {
  // key is 1 through 64 lowercase ASCII identifier characters.
  string key = 1;
  // value is at most 256 UTF-8 bytes.
  string value = 2;
}
