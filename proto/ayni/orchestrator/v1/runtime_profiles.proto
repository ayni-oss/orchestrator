syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/certificates.proto";
import "ayni/orchestrator/v1/common.proto";
import "google/protobuf/timestamp.proto";

// RuntimeProfileService manages versioned runtime configuration and its reconciled resources.
service RuntimeProfileService {
  rpc InspectAyniRepository(InspectAyniRepositoryRequest) returns (InspectAyniRepositoryResponse);
  rpc ListRuntimeProfiles(ListRuntimeProfilesRequest) returns (ListRuntimeProfilesResponse);
  rpc GetRuntimeProfile(GetRuntimeProfileRequest) returns (GetRuntimeProfileResponse);
  rpc CreateRuntimeProfile(CreateRuntimeProfileRequest) returns (CreateRuntimeProfileResponse);
  rpc ListRuntimeProfileRevisions(ListRuntimeProfileRevisionsRequest) returns (ListRuntimeProfileRevisionsResponse);
  rpc GetRuntimeProfileRevision(GetRuntimeProfileRevisionRequest) returns (GetRuntimeProfileRevisionResponse);
  rpc ListRuntimeArtifacts(ListRuntimeArtifactsRequest) returns (ListRuntimeArtifactsResponse);
  rpc GetRuntimeArtifact(GetRuntimeArtifactRequest) returns (GetRuntimeArtifactResponse);
  rpc ReconcileRuntimeProfile(ReconcileRuntimeProfileRequest) returns (ReconcileRuntimeProfileResponse);
  rpc SetRuntimeCertificate(SetRuntimeCertificateRequest) returns (SetRuntimeCertificateResponse);
  rpc SetRuntimeRegistry(SetRuntimeRegistryRequest) returns (SetRuntimeRegistryResponse);
  rpc WatchRuntimeProfiles(WatchRuntimeProfilesRequest) returns (stream WatchRuntimeProfilesResponse);
}

// RuntimeProfileKind is the closed set of product runtime profiles.
enum RuntimeProfileKind {
  RUNTIME_PROFILE_KIND_UNSPECIFIED = 0;
  RUNTIME_PROFILE_KIND_AYNI_MANAGED = 1;
  RUNTIME_PROFILE_KIND_CUSTOM_RUNTIME = 2;
}

// RuntimeProfileSupport makes intentionally unavailable profile behavior explicit.
enum RuntimeProfileSupport {
  RUNTIME_PROFILE_SUPPORT_UNSPECIFIED = 0;
  RUNTIME_PROFILE_SUPPORT_OPERATIONAL = 1;
  RUNTIME_PROFILE_SUPPORT_UNSUPPORTED = 2;
}

// RuntimeProfileState is the independently reconciled onboarding/readiness state.
enum RuntimeProfileState {
  RUNTIME_PROFILE_STATE_UNSPECIFIED = 0;
  RUNTIME_PROFILE_STATE_SETUP_REQUIRED = 1;
  RUNTIME_PROFILE_STATE_SETUP_PR_OPEN = 2;
  RUNTIME_PROFILE_STATE_AWAITING_ENVIRONMENT = 3;
  RUNTIME_PROFILE_STATE_READY = 4;
  RUNTIME_PROFILE_STATE_UPDATING = 5;
  RUNTIME_PROFILE_STATE_DEGRADED = 6;
  RUNTIME_PROFILE_STATE_FAILED = 7;
}

// RuntimeArtifactStatus is the admission state of one immutable OCI artifact.
enum RuntimeArtifactStatus {
  RUNTIME_ARTIFACT_STATUS_UNSPECIFIED = 0;
  RUNTIME_ARTIFACT_STATUS_DISCOVERED = 1;
  RUNTIME_ARTIFACT_STATUS_VERIFYING = 2;
  RUNTIME_ARTIFACT_STATUS_VERIFIED = 3;
  RUNTIME_ARTIFACT_STATUS_REJECTED = 4;
  RUNTIME_ARTIFACT_STATUS_UNAVAILABLE = 5;
  RUNTIME_ARTIFACT_STATUS_FAILED = 6;
}

// RuntimeProfile is one repository's selected closed runtime variant.
message RuntimeProfile {
  string id = 1;
  string repository_connection_id = 2;
  RuntimeProfileKind kind = 3;
  RuntimeProfileSupport support = 4;
  RuntimeProfileState state = 5;
  optional string active_revision_id = 6;
  optional string active_runtime_artifact_id = 7;
  optional ResourceFailure failure = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  uint64 resource_version = 11;
  // reconciliation_metadata contains at most 16 credential-free observations.
  // These are operational status, not artifact verification evidence.
  repeated VerifiedMetadata reconciliation_metadata = 12;
  // Absent only for profiles stored before runtime-owned registry selection.
  // Present with empty values selects deployment infrastructure defaults.
  RuntimeRegistrySelection registry = 13;
  // Server-computed destination for the selected connection; never write authority.
  string desired_image_repository = 14;
  // Empty selection follows the global enabled default certificate.
  optional string certificate_id = 15;
  // Safe server-computed signing identity; never contains private material.
  Certificate effective_certificate = 16;
  repeated RuntimeFinding findings = 17;
  string preparation_phase = 18;
  bool rebuild_available = 19;
}

// RuntimeProfileRevision is an immutable version of profile configuration.
message RuntimeProfileRevision {
  string id = 1;
  string runtime_profile_id = 2;
  string repository_snapshot_id = 3;
  // repository_revision is exactly 40 lowercase hexadecimal characters.
  string repository_revision = 4;
  uint64 revision_number = 5;
  oneof configuration {
    AyniManagedProfileRevision ayni_managed = 6;
    CustomRuntimeProfileRevision custom_runtime = 7;
  }
  google.protobuf.Timestamp created_at = 8;
  uint64 resource_version = 9;
}

// AyniManagedProfileRevision contains only Ayni Managed configuration.
message AyniManagedProfileRevision {
  // lock_fingerprint is 64 lowercase hexadecimal characters, or empty while setup is incomplete.
  string lock_fingerprint = 1;
  // ayni_version is 1 through 128 safe version bytes.
  string ayni_version = 2;
  reserved 3;
  reserved "workflow_template_version";
  // oci_repository is a normalized registry/repository name, without tag or digest,
  // of at most 512 ASCII bytes.
  string oci_repository = 4;
  // runtime_source_digest binds the credential-free operator source policy.
  // When present, this is sha256 followed by a colon and 64 lowercase hex bytes.
  optional string runtime_source_digest = 5;
}

// CustomRuntimeProfileRevision contains no Ayni lock or workflow fields.
message CustomRuntimeProfileRevision {
  // image_reference is a supported external OCI repository reference of at most 512 ASCII bytes.
  string image_reference = 1;
}

// RuntimeArtifact is one immutable, platform-specific OCI runtime admission.
message RuntimeArtifact {
  string id = 1;
  string runtime_profile_revision_id = 2;
  // oci_repository is a normalized registry/repository name without a tag or digest.
  string oci_repository = 3;
  // discovery_tag is mutable lookup metadata, at most 128 ASCII bytes, and never task authority.
  optional string discovery_tag = 4;
  // resolved_digest is `sha256:` followed by 64 lowercase hexadecimal characters.
  string resolved_digest = 5;
  OciPlatform platform = 6;
  RuntimeArtifactOrigin origin = 7;
  RuntimeArtifactStatus status = 8;
  // verified_metadata contains at most 32 unique keys and at most 8,192 aggregate bytes.
  repeated VerifiedMetadata verified_metadata = 9;
  optional ResourceFailure failure = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp verified_at = 12;
  uint64 resource_version = 13;
}

// RuntimeArtifactOrigin identifies how an artifact entered reconciliation.
message RuntimeArtifactOrigin {
  oneof origin {
    ExternalArtifactOrigin external = 2;
  }
}

// ExternalArtifactOrigin records provider-neutral OCI runtime discovery.
message ExternalArtifactOrigin {
  // supplied_reference is the owner-supplied OCI reference, at most 512 ASCII bytes.
  string supplied_reference = 1;
  google.protobuf.Timestamp observed_at = 2;
}

message RuntimeProfileConfiguration {
  oneof configuration {
    AyniManagedProfileRevision ayni_managed = 1;
    CustomRuntimeProfileRevision custom_runtime = 2;
  }
}

message ListRuntimeProfilesRequest {
  optional string repository_connection_id = 1;
  optional RuntimeProfileKind kind = 2;
  optional RuntimeProfileState state = 3;
  PageRequest page = 4;
}

message ListRuntimeProfilesResponse {
  repeated RuntimeProfile runtime_profiles = 1;
  PageResponse page = 2;
}

message GetRuntimeProfileRequest {
  string runtime_profile_id = 1;
}

message GetRuntimeProfileResponse {
  RuntimeProfile runtime_profile = 1;
}

message CreateRuntimeProfileRequest {
  string idempotency_key = 1;
  string repository_connection_id = 2;
  string repository_snapshot_id = 3;
  RuntimeProfileConfiguration configuration = 4;
}

message CreateRuntimeProfileResponse {
  RuntimeProfile runtime_profile = 1;
  RuntimeProfileRevision revision = 2;
}

message ListRuntimeProfileRevisionsRequest {
  string runtime_profile_id = 1;
  PageRequest page = 2;
}

message ListRuntimeProfileRevisionsResponse {
  repeated RuntimeProfileRevision revisions = 1;
  PageResponse page = 2;
}

message GetRuntimeProfileRevisionRequest {
  string runtime_profile_revision_id = 1;
}

message GetRuntimeProfileRevisionResponse {
  RuntimeProfileRevision revision = 1;
}

message ListRuntimeArtifactsRequest {
  string runtime_profile_id = 1;
  optional string runtime_profile_revision_id = 2;
  optional RuntimeArtifactStatus status = 3;
  PageRequest page = 4;
}

message ListRuntimeArtifactsResponse {
  repeated RuntimeArtifact runtime_artifacts = 1;
  PageResponse page = 2;
}

message GetRuntimeArtifactRequest {
  string runtime_artifact_id = 1;
}

message GetRuntimeArtifactResponse {
  RuntimeArtifact runtime_artifact = 1;
}

message ReconcileRuntimeProfileRequest {
  string idempotency_key = 1;
  string runtime_profile_id = 2;
  // Creates a fresh internal build intent rather than only waking reconciliation.
  bool force_rebuild = 3;
}

message ReconcileRuntimeProfileResponse {
  RuntimeProfile runtime_profile = 1;
}

message WatchRuntimeProfilesRequest {
  optional uint64 after_cursor = 1;
  optional string repository_connection_id = 2;
  optional string runtime_profile_id = 3;
}

message WatchRuntimeProfilesResponse {
  uint64 cursor = 1;
  oneof update {
    RuntimeProfile runtime_profile = 2;
    RuntimeProfileRevision revision = 3;
    RuntimeArtifact runtime_artifact = 4;
    RuntimeProfileRemoved runtime_profile_removed = 6;
  }
  reserved 5;
  reserved "automation_installation";
}

message InspectAyniRepositoryRequest {
  string repository_connection_id = 1;
}

// Safe onboarding observations. No credential values or private artifact bytes.
message InspectAyniRepositoryResponse {
  string repository_snapshot_id = 1;
  string repository_revision = 2;
  string lock_fingerprint = 3;
  string ayni_version = 4;
  reserved 5;
  reserved "workflow_template_version";
  string oci_repository = 6;
  bool policy_present = 7;
  bool lock_compatible = 8;
  bool trust_policy_pinned = 9;
  string reason = 10;
  repeated RuntimeFinding findings = 12;
  reserved 11;
  reserved "workflows";
}

// RuntimeRegistrySelection survives source revisions and rebuilds of its profile.
message RuntimeRegistrySelection {
  string registry_connection_id = 1;
  reserved 2;
  reserved "image_namespace";
}

message SetRuntimeRegistryRequest {
  string idempotency_key = 1;
  string runtime_profile_id = 2;
  uint64 expected_resource_version = 3;
  string registry_connection_id = 4;
  reserved 5;
  reserved "image_namespace";
}

message SetRuntimeRegistryResponse {
  RuntimeProfile runtime_profile = 1;
}

message SetRuntimeCertificateRequest {
  string idempotency_key = 1;
  string runtime_profile_id = 2;
  uint64 expected_resource_version = 3;
  string certificate_id = 4;
}

message SetRuntimeCertificateResponse {
  RuntimeProfile runtime_profile = 1;
}

// A safe, actionable preparation finding; never a provider response or credential.
message RuntimeFinding {
  string code = 1;
  string message = 2;
  string remediation = 3;
}

message RuntimeProfileRemoved {
  string runtime_profile_id = 1;
  string repository_connection_id = 2;
}
