syntax = "proto3";
package ayni.orchestrator.v1;

// Configuration is context plus a selection from the application's fixed role catalog.
// Skills and tool descriptions cannot grant permissions or carry credentials.
message AgentSkillRevision {
  string id = 1;
  string revision = 2;
  string instructions = 3;
}
message AgentProfileSettings {
  string instructions = 1;
  repeated AgentSkillRevision skills = 2;
  repeated string allowed_tools = 3;
  repeated string repository_ids = 4;
  uint32 max_model_calls = 5;
  uint64 deadline_seconds = 6;
}
message FrozenAgentProfile {
  string revision = 1;
  string role = 2;
  string provider = 3;
  string connection_id = 4;
  string credential_revision = 5;
  string model = 6;
  AgentProfileSettings settings = 7;
  repeated string repository_ids = 8;
  string policy_revision = 9;
  string system_instructions = 10;
}

// Read-only application capability metadata; selections never grant authority.
service AgentProfileService {
  rpc GetAgentCapabilities(GetAgentCapabilitiesRequest) returns (GetAgentCapabilitiesResponse);
}
message GetAgentCapabilitiesRequest {}
message AgentProfileLimits {
  uint32 max_instruction_bytes = 1;
  uint32 max_skills = 2;
  uint32 max_repositories = 3;
  uint32 max_model_calls = 4;
  uint64 max_deadline_seconds = 5;
  uint32 max_identifier_bytes = 6;
}
message AgentRoleCapabilities {
  string role = 1;
  AgentProfileSettings defaults = 2;
}
message GetAgentCapabilitiesResponse {
  repeated AgentRoleCapabilities roles = 1;
  AgentProfileLimits limits = 2;
}
