syntax = "proto3";
package ayni.orchestrator.v1;

import "google/protobuf/timestamp.proto";

// Declared inputs are not verified repository evidence or execution permission.
message PlanTaskSpecification {
  string key = 1;
  string objective = 2;
  string scope = 3;
  string out_of_scope = 4;
  repeated string acceptance_criteria = 5;
  string repository = 6;
  string source_ref = 7;
  string execution_limits = 8;
  repeated string unresolved_inputs = 9;
}
message PlanContent {
  string title = 1;
  string objective = 2;
  string scope = 3;
  string out_of_scope = 4;
  repeated string constraints = 5;
  repeated string unresolved_questions = 6;
  repeated PlanTaskSpecification tasks = 7;
}
message PlanSummary {
  string id = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  string current_version_id = 5;
  uint64 current_ordinal = 6;
  string title = 7;
  string follows_plan_id = 8;
  // Empty until the one authoritative approval commits.
  string approval_id = 9;
}
message PlanVersion {
  string id = 1;
  string plan_id = 2;
  string workspace_id = 3;
  string project_id = 4;
  string conversation_id = 5;
  uint64 ordinal = 6;
  string predecessor_id = 7;
  string content_digest = 8;
  PlanContent content = 9;
  string author = 10;
  google.protobuf.Timestamp created_at = 11;
  AgentPlanProvenance provenance = 12;
}
message PlanWriteReceipt {
  string command_id = 1;
  string plan_id = 2;
  string version_id = 3;
  uint64 conversation_revision = 4;
  string resume_cursor = 5;
}
message CreatePlanRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string idempotency_key = 4;
  PlanContent content = 5;
  string follows_plan_id = 6;
}
message RevisePlanRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string idempotency_key = 4;
  string plan_id = 5;
  string expected_version_id = 6;
  PlanContent content = 7;
}
message CreatePlanResponse {
  PlanVersion version = 1;
  PlanWriteReceipt receipt = 2;
}
message RevisePlanResponse {
  PlanVersion version = 1;
  PlanWriteReceipt receipt = 2;
}
message GetPlanVersionRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string plan_id = 4;
  // Empty selects the current version in one read.
  string version_id = 5;
}
message GetPlanVersionResponse {
  PlanVersion version = 1;
}
message ListPlansRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
}
// At most 32 heads; included atomically in conversation snapshots too.
message ListPlansResponse {
  repeated PlanSummary plans = 1;
}
message ListPlanVersionsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string plan_id = 4;
  // Exclusive descending ordinal; zero starts at the newest version.
  uint64 before_ordinal = 5;
  // Default 10, maximum 20. Versions never change during pagination.
  uint32 limit = 6;
}
message PlanVersionSummary {
  string id = 1;
  uint64 ordinal = 2;
  string content_digest = 3;
  string author = 4;
  google.protobuf.Timestamp created_at = 5;
}
message ListPlanVersionsResponse {
  repeated PlanVersionSummary versions = 1;
  uint64 next_before_ordinal = 2;
}

// Application-derived origin and provider-declared assumptions/evidence.
// Evidence references are declarations, not verified repository/source facts.
message AgentPlanProvenance {
  string source_turn_id = 1;
  string configuration_revision_id = 2;
  string context_digest = 3;
  string provider_call_id = 4;
  string provider_response_id = 5;
  string assignment_id = 6;
  uint64 executor_generation = 7;
  string report_source = 8;
  string report_id = 9;
  string report_digest = 10;
  string invocation_id = 11;
  repeated string assumptions = 12;
  repeated string evidence = 13;
}

// The retained authorization of an exact immutable version. The trusted operator
// identity is server-derived; model/provider calls cannot supply it.
message PlanApprovalReceipt {
  string id = 1;
  string command_id = 2;
  string workspace_id = 3;
  string project_id = 4;
  string conversation_id = 5;
  string plan_id = 6;
  string version_id = 7;
  string content_digest = 8;
  string operator = 9;
  string request_digest = 10;
  google.protobuf.Timestamp created_at = 11;
  uint64 conversation_revision = 12;
  string resume_cursor = 13;
  repeated string task_ids = 14;
}
// Frozen reviewed specification and origin. Admission never dispatches coding
// work. Declared repository/source references remain unverified in this slice.
message AdmittedTask {
  string id = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  string plan_id = 5;
  string version_id = 6;
  string content_digest = 7;
  string approval_id = 8;
  string proposed_task_key = 9;
  PlanTaskSpecification specification = 10;
  string state = 11;
  repeated string execution_blockers = 12;
  google.protobuf.Timestamp created_at = 13;
}
message ApprovePlanRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string idempotency_key = 4;
  string plan_id = 5;
  string expected_version_id = 6;
  string content_digest = 7;
}
message ApprovePlanResponse {
  PlanApprovalReceipt approval = 1;
  // Complete ordered set, bounded by the 32-task plan limit.
  repeated AdmittedTask tasks = 2;
}
message GetPlanApprovalRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string plan_id = 4;
}
message GetPlanApprovalResponse {
  // Absent for a scoped plan that has not been approved.
  PlanApprovalReceipt approval = 1;
  repeated AdmittedTask tasks = 2;
}
// Live scoped ID-keyset pagination; limit defaults to 20, maximum 32.
message ListTasksRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string after_id = 4;
  uint32 limit = 5;
}
message ListTasksResponse {
  repeated AdmittedTask tasks = 1;
  string next_after_id = 2;
}
message GetTaskRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
}
message GetTaskResponse {
  AdmittedTask task = 1;
}

// Operator-attested Git object evidence, produced by workflow-prepare-task.
// Runtime selection does not assert Ayni runtime compatibility; PR 3 verifies it.
message TaskExecutionInputs {
  string repository = 1;
  string source_ref = 2;
  string source_commit = 3;
  string lock_digest = 4;
  string runtime_image = 5;
  uint32 max_seconds = 6;
  uint32 max_tokens = 7;
}
message TaskExecutionPreparation {
  string command_id = 1;
  string task_id = 2;
  // Empty for a retained blocked preparation. Otherwise one frozen prepared attempt.
  string attempt_id = 3;
  TaskExecutionInputs inputs = 4;
  repeated string blockers = 5;
  string configuration_revision_id = 6;
  uint64 conversation_revision = 7;
  string resume_cursor = 8;
  google.protobuf.Timestamp created_at = 9;
}
message PrepareTaskExecutionRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string idempotency_key = 5;
  TaskExecutionInputs inputs = 6;
}
message PrepareTaskExecutionResponse {
  TaskExecutionPreparation preparation = 1;
}
message GetTaskExecutionRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
}
message GetTaskExecutionResponse {
  TaskExecutionPreparation preparation = 1;
}

message StartTaskExecutionRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
  string idempotency_key = 6;
  // Git pack containing the exact commit and its snapshot objects, maximum 8 MiB.
  bytes source_pack = 7;
}
message CancelTaskExecutionRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
  string idempotency_key = 6;
}
message TaskExecutionCommandReceipt {
  string command_id = 1;
  string attempt_id = 2;
  uint64 conversation_revision = 3;
  string resume_cursor = 4;
}
message StartTaskExecutionResponse {
  TaskExecutionCommandReceipt receipt = 1;
}
message CancelTaskExecutionResponse {
  TaskExecutionCommandReceipt receipt = 1;
}
message GetTaskAttemptRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
}
message TaskAttempt {
  string attempt_id = 1;
  string task_id = 2;
  string state = 3;
  uint64 generation = 4;
  string pod_uid = 5;
  string provider_state = 6;
  string patch = 7;
  string safe_reason = 8;
  string patch_digest = 9;
  string source_commit = 10;
  string runtime_image = 11;
  string configuration_revision_id = 12;
  TaskQualityOutcome quality = 13;
  string execution_outcome = 14;
  TaskPublication publication = 15;
  string quality_digest = 16;
  string parent_attempt_id = 17;
  string recovery_proposal_id = 18;
  string saved_input_patch = 19;
  uint32 max_seconds = 20;
  uint32 max_tokens = 21;
}
message GetTaskAttemptResponse {
  TaskAttempt attempt = 1;
}

// Retained Ayni evidence is independent of the coding outcome and publication.
message TaskQualityOutcome {
  string state = 1;
  string safe_reason = 2;
  string snapshot_digest = 3;
  string lock_digest = 4;
  string runtime_image = 5;
  string runtime_platform = 6;
  string runtime_metadata_digest = 7;
  string executor_digest = 8;
  optional int32 exit_code = 9;
  string artifact_digest = 10;
  string artifact = 11;
  uint64 expected_targets = 12;
  uint64 completed_targets = 13;
  string contract_digest = 14;
  string lock_fingerprint = 15;
  string source_fingerprint = 16;
  string validation_input_digest = 17;
}

message StartTaskPublicationRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
  string idempotency_key = 6;
  string expected_patch_digest = 7;
  string expected_quality_digest = 8;
}
message CancelTaskPublicationRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
  string idempotency_key = 6;
}
message TaskPublicationCommandReceipt {
  string command_id = 1;
  string publication_id = 2;
  string attempt_id = 3;
  uint64 conversation_revision = 4;
  string resume_cursor = 5;
}
message StartTaskPublicationResponse {
  TaskPublicationCommandReceipt receipt = 1;
}
message CancelTaskPublicationResponse {
  TaskPublicationCommandReceipt receipt = 1;
}
message TaskPublication {
  string publication_id = 1;
  string attempt_id = 2;
  string state = 3;
  uint64 generation = 4;
  string branch = 5;
  string base_branch = 6;
  string commit_sha = 7;
  string tree_sha = 8;
  uint64 pr_number = 9;
  string pr_url = 10;
  string safe_reason = 11;
  string quality_digest = 12;
  string patch_digest = 13;
  string repository = 14;
  string pr_state = 15;
}

// Immutable first actionable execution/quality feedback for an attempt.
// Recovery and resolution commands are introduced separately.
message TaskFeedback {
  string id = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  string task_id = 5;
  string attempt_id = 6;
  string category = 7;
  string state = 8;
  string safe_reason = 9;
  string summary = 10;
  google.protobuf.Timestamp created_at = 11;
  // Resolved means a recovery was authorized, not that continued work succeeded.
  string recovery_attempt_id = 12;
  string recovery_state = 13;
  string recovery_quality_state = 14;
}
message ListTaskFeedbackRequest {
  string workspace_id = 1;
  string project_id = 2;
  // Empty lists project attention; otherwise selects the exact origin.
  string conversation_id = 3;
  string after_id = 4;
  // Default 20, maximum 32. Exclusive ascending ID-keyset pagination.
  uint32 limit = 5;
}
message ListTaskFeedbackResponse {
  repeated TaskFeedback feedback = 1;
  string next_after_id = 2;
}

// Immutable local-operator review records. Recording or answering never executes work.
message TaskRecoveryProposal {
  string feedback_id = 1;
  string explanation = 2;
  // continue, repair_quality, or replace_attempt; all remain proposals only.
  string action = 3;
  uint32 additional_seconds = 4;
  uint32 additional_tokens = 5;
  string safe_reason = 6;
  TaskSavedEvidence evidence = 7;
}
message TaskSavedEvidence {
  string state = 1;
  uint64 generation = 2;
  bool provider_uncertain = 3;
  string source_commit = 4;
  string runtime_image = 5;
  string configuration_revision_id = 6;
  bool patch_available = 7;
  string patch_digest = 8;
  string outcome_digest = 9;
  string quality_digest = 10;
  string quality_state = 11;
  string limitations = 12;
}
message TaskQuestion {
  string text = 1;
}
message TaskAnswer {
  string question_id = 1;
  string text = 2;
}
message TaskRecoveryRecord {
  string id = 1;
  string workspace_id = 2;
  string project_id = 3;
  string conversation_id = 4;
  string task_id = 5;
  string attempt_id = 6;
  string kind = 7;
  string content_digest = 8;
  google.protobuf.Timestamp created_at = 9;
  // Current records come from the trusted local operator, never the coding worker.
  string author = 10;
  oneof content {
    TaskRecoveryProposal proposal = 11;
    TaskQuestion question = 12;
    TaskAnswer answer = 13;
  }
}
message RecordTaskRecoveryRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
  string idempotency_key = 6;
  // Proposal evidence and safe_reason are server derived; supplied values are rejected.
  oneof content {
    TaskRecoveryProposal proposal = 7;
    TaskQuestion question = 8;
    TaskAnswer answer = 9;
  }
}
message RecordTaskRecoveryResponse {
  TaskRecoveryRecord record = 1;
}
message ListTaskRecoveryRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string attempt_id = 5;
  string after_id = 6;
  uint32 limit = 7;
}
message ListTaskRecoveryResponse {
  repeated TaskRecoveryRecord records = 1;
  string next_after_id = 2;
  // Separate once-only authority; proposal content remains immutable.
  repeated TaskRecoveryConfirmation confirmations = 3;
  // Canonical answers for questions on this page, even when the answer is on a later page.
  repeated TaskRecoveryRecord question_answers = 4;
}
message ConfirmTaskRecoveryRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string task_id = 4;
  string proposal_id = 5;
  string proposal_digest = 6;
  string idempotency_key = 7;
  bool acknowledge_provider_uncertainty = 8;
}
message TaskRecoveryConfirmation {
  string command_id = 1;
  string proposal_id = 2;
  string proposal_digest = 3;
  string parent_attempt_id = 4;
  string attempt_id = 5;
  uint64 conversation_revision = 6;
  string resume_cursor = 7;
  bool acknowledged_provider_uncertainty = 8;
}
message ConfirmTaskRecoveryResponse {
  TaskRecoveryConfirmation confirmation = 1;
}
