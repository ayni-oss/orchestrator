syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/workflow.proto";
import "google/protobuf/timestamp.proto";

// Minimal hierarchy commands and bounded discovery on the trusted operator listener.
service ProjectService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetAgentConfiguration(GetAgentConfigurationRequest) returns (GetAgentConfigurationResponse);
  rpc UpdateAgentConfiguration(UpdateAgentConfigurationRequest) returns (UpdateAgentConfigurationResponse);
  rpc GetTurnInputs(GetTurnInputsRequest) returns (GetTurnInputsResponse);
  rpc GetTurnContextInputs(GetTurnContextInputsRequest) returns (GetTurnContextInputsResponse);
}

message Workspace {
  reserved 3, 4, 8, 9;
  reserved "state", "repository_connection_ids", "agent_defaults", "planner_idle_timeout_seconds";

  string id = 1;
  string display_name = 2;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  uint64 resource_version = 7;
}

message CreateWorkspaceRequest {
  reserved 3 to 5;
  reserved "repository_connection_ids", "agent_defaults", "planner_idle_timeout_seconds";

  string idempotency_key = 1;
  string display_name = 2;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
  CommandReceipt receipt = 2;
}

message Project {
  reserved 3, 4, 8;
  reserved "state", "repository_connection_ids", "agent_defaults";

  string id = 1;
  string display_name = 2;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  uint64 resource_version = 7;
  string workspace_id = 9;
  string goal = 10;
}

message CreateProjectRequest {
  reserved 3, 4;
  reserved "repository_connection_id", "repository_connection_ids";

  string idempotency_key = 1;
  string display_name = 2;
  string workspace_id = 5;
  string goal = 6;
}

message CreateProjectResponse {
  Project project = 1;
  CommandReceipt receipt = 2;
}

// Live keyset discovery ordered by ID. Limit defaults to 50 and is at most 100.
// Pages are not a frozen catalog snapshot; refresh to discover concurrent inserts.
message ListWorkspacesRequest {
  string after_id = 1;
  uint32 limit = 2;
}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  string next_after_id = 2;
}
message ListProjectsRequest {
  string workspace_id = 1;
  string after_id = 2;
  uint32 limit = 3;
}
message ListProjectsResponse {
  repeated Project projects = 1;
  string next_after_id = 2;
}

// Interface v1; revision_id identifies one immutable snapshot, not an API version.
// The same snapshot binds instructions, desired provider/model, budget and idle policy.
message AgentConfiguration {
  string workspace_id = 1;
  string revision_id = 2;
  string instructions = 3;
  string provider = 4;
  string model = 5;
  uint64 max_input_tokens = 6;
  uint64 max_output_tokens = 7;
  uint64 max_total_tokens = 8;
  uint64 idle_timeout_seconds = 9;
}
message GetAgentConfigurationRequest {
  string workspace_id = 1;
  // Empty selects the current revision.
  string revision_id = 2;
}
message GetAgentConfigurationResponse {
  AgentConfiguration configuration = 1;
}
message UpdateAgentConfigurationRequest {
  string idempotency_key = 1;
  string expected_revision_id = 2;
  // revision_id must be empty; the server assigns the immutable identity.
  AgentConfiguration configuration = 3;
}
message UpdateAgentConfigurationResponse {
  AgentConfiguration configuration = 1;
}
message GetTurnInputsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string turn_id = 4;
}
message GetTurnInputsResponse {
  string turn_id = 1;
  AgentConfiguration configuration = 2;
  // Exact retained event identity, available once the turn is eligible. This is
  // distinct from the admission receipt command_id and grants no execution.
  string command_event_id = 3;
}

message GetTurnContextInputsRequest {
  string workspace_id = 1;
  string project_id = 2;
  string conversation_id = 3;
  string turn_id = 4;
  uint64 after_ordinal = 5;
  uint32 limit = 6;
}
message ContextInputRecord {
  string message_id = 1;
  uint64 sequence = 2;
  string role = 3;
  string content = 4;
}
message GetTurnContextInputsResponse {
  string manifest_id = 1;
  string digest = 2;
  uint64 record_count = 3;
  repeated ContextInputRecord records = 4;
  uint64 next_after_ordinal = 5;
}
