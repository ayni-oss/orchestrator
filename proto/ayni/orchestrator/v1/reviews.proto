syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/common.proto";
import "google/protobuf/timestamp.proto";

// ReviewService observes candidate publication, exact-head assessments, and evidence.
service ReviewService {
  rpc ListChangeRequests(ListChangeRequestsRequest) returns (ListChangeRequestsResponse);
  rpc GetChangeRequest(GetChangeRequestRequest) returns (GetChangeRequestResponse);
  rpc PublishCandidate(PublishCandidateRequest) returns (PublishCandidateResponse);
  rpc ListAssessments(ListAssessmentsRequest) returns (ListAssessmentsResponse);
  rpc GetAssessment(GetAssessmentRequest) returns (GetAssessmentResponse);
  rpc ListEvidenceReferences(ListEvidenceReferencesRequest) returns (ListEvidenceReferencesResponse);
  rpc GetEvidenceReference(GetEvidenceReferenceRequest) returns (GetEvidenceReferenceResponse);
  rpc WatchReviews(WatchReviewsRequest) returns (stream WatchReviewsResponse);
}

// ChangeRequestState is provider review state, independent of assessment conclusion.
enum ChangeRequestState {
  CHANGE_REQUEST_STATE_UNSPECIFIED = 0;
  CHANGE_REQUEST_STATE_PUBLISHING = 1;
  CHANGE_REQUEST_STATE_DRAFT = 2;
  CHANGE_REQUEST_STATE_OPEN = 3;
  CHANGE_REQUEST_STATE_CLOSED = 4;
  CHANGE_REQUEST_STATE_MERGED = 5;
  CHANGE_REQUEST_STATE_FAILED = 6;
}

// AssessmentConclusion is the explicit producer result for one exact head.
enum AssessmentConclusion {
  ASSESSMENT_CONCLUSION_UNSPECIFIED = 0;
  ASSESSMENT_CONCLUSION_SUCCEEDED = 1;
  ASSESSMENT_CONCLUSION_QUALITY_FAILED = 2;
  ASSESSMENT_CONCLUSION_INCOMPLETE = 3;
  ASSESSMENT_CONCLUSION_POLICY_REJECTED = 4;
  ASSESSMENT_CONCLUSION_STALE = 5;
  ASSESSMENT_CONCLUSION_CANCELLED = 6;
  ASSESSMENT_CONCLUSION_INFRASTRUCTURE_FAILED = 7;
  ASSESSMENT_CONCLUSION_UNSUPPORTED = 8;
}

// AssessmentProducerKind separates managed and external assessment trust.
enum AssessmentProducerKind {
  ASSESSMENT_PRODUCER_KIND_UNSPECIFIED = 0;
  ASSESSMENT_PRODUCER_KIND_AYNI_MANAGED = 1;
  ASSESSMENT_PRODUCER_KIND_EXTERNAL = 2;
}

// ChangeRequestProvider isolates provider-specific review identity.
message ChangeRequestProvider {
  oneof provider {
    GithubChangeRequest github = 1;
  }
}

// GithubChangeRequest contains GitHub-only pull-request identity.
message GithubChangeRequest {
  // repository_id is the provider's stable decimal repository identifier.
  string repository_id = 1;
  uint64 pull_request_number = 2;
  // html_url is an HTTPS URL of at most 2,048 bytes.
  string html_url = 3;
}

// ChangeRequest is a provider review object published from one candidate.
message ChangeRequest {
  string id = 1;
  string repository_connection_id = 2;
  string candidate_id = 3;
  ChangeRequestProvider provider = 4;
  // base_revision and head_revision are exact 40-character lowercase Git object IDs.
  string base_revision = 5;
  string head_revision = 6;
  ChangeRequestState state = 7;
  optional ResourceFailure failure = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  uint64 resource_version = 11;
}

// AssessmentProducer identifies the bounded producer implementation.
message AssessmentProducer {
  AssessmentProducerKind kind = 1;
  // name and version are each 1 through 128 safe UTF-8 bytes.
  string name = 2;
  string version = 3;
}

// Assessment is an immutable producer result for one exact change-request head.
message Assessment {
  string id = 1;
  string repository_connection_id = 2;
  string change_request_id = 3;
  // head_revision is exactly 40 lowercase hexadecimal characters and must match
  // the observed provider head used by the producer.
  string head_revision = 4;
  string runtime_profile_revision_id = 5;
  AssessmentProducer producer = 6;
  WorkflowExecution workflow = 7;
  AssessmentConclusion conclusion = 8;
  oneof details {
    AyniManagedAssessment ayni_managed = 9;
    ExternalAssessment external = 10;
  }
  // evidence_reference_ids contains at most 32 immutable references.
  repeated string evidence_reference_ids = 11;
  google.protobuf.Timestamp created_at = 12;
  uint64 resource_version = 13;
}

// AyniManagedAssessment contains fields meaningful only to Ayni Managed.
message AyniManagedAssessment {
  // lock_fingerprint is exactly 64 lowercase hexadecimal characters.
  string lock_fingerprint = 1;
  // runtime_digest and manifest_digest are `sha256:` plus 64 lowercase hex characters.
  string runtime_digest = 2;
  string manifest_digest = 3;
  uint32 completed_target_count = 4;
  uint32 skipped_target_count = 5;
  uint32 warning_count = 6;
  uint32 failure_count = 7;
}

// ExternalAssessment identifies an external, non-Ayni producer result.
message ExternalAssessment {
  // system is 1 through 128 safe UTF-8 bytes.
  string system = 1;
}

// EvidenceReference is immutable digest-verified assessment evidence metadata.
message EvidenceReference {
  string id = 1;
  string assessment_id = 2;
  // name is a 1 through 128 byte safe relative artifact name.
  string name = 3;
  // digest is `sha256:` followed by 64 lowercase hexadecimal characters.
  string digest = 4;
  // media_type is 1 through 128 safe ASCII bytes.
  string media_type = 5;
  // size_bytes must not exceed the documented server evidence-object limit.
  uint64 size_bytes = 6;
  // metadata contains at most 16 unique keys and at most 4,096 aggregate bytes.
  repeated VerifiedMetadata metadata = 7;
  google.protobuf.Timestamp verified_at = 8;
  uint64 resource_version = 9;
}

message ListChangeRequestsRequest {
  optional string repository_connection_id = 1;
  optional string candidate_id = 2;
  optional ChangeRequestState state = 3;
  PageRequest page = 4;
}

message ListChangeRequestsResponse {
  repeated ChangeRequest change_requests = 1;
  PageResponse page = 2;
}

message GetChangeRequestRequest {
  string change_request_id = 1;
}

message GetChangeRequestResponse {
  ChangeRequest change_request = 1;
}

message PublishCandidateRequest {
  string idempotency_key = 1;
  string candidate_id = 2;
  // title is 1 through 256 UTF-8 bytes.
  string title = 3;
  // body is at most 32,768 UTF-8 bytes.
  string body = 4;
  // base_branch is 1 through 255 safe provider-reference bytes.
  string base_branch = 5;
  bool draft = 6;
}

message PublishCandidateResponse {
  ChangeRequest change_request = 1;
}

message ListAssessmentsRequest {
  string change_request_id = 1;
  optional string head_revision = 2;
  optional AssessmentConclusion conclusion = 3;
  PageRequest page = 4;
}

message ListAssessmentsResponse {
  repeated Assessment assessments = 1;
  PageResponse page = 2;
}

message GetAssessmentRequest {
  string assessment_id = 1;
}

message GetAssessmentResponse {
  Assessment assessment = 1;
}

message ListEvidenceReferencesRequest {
  string assessment_id = 1;
  PageRequest page = 2;
}

message ListEvidenceReferencesResponse {
  repeated EvidenceReference evidence_references = 1;
  PageResponse page = 2;
}

message GetEvidenceReferenceRequest {
  string evidence_reference_id = 1;
}

message GetEvidenceReferenceResponse {
  EvidenceReference evidence_reference = 1;
}

message WatchReviewsRequest {
  optional uint64 after_cursor = 1;
  optional string repository_connection_id = 2;
  optional string change_request_id = 3;
}

message WatchReviewsResponse {
  uint64 cursor = 1;
  oneof update {
    ChangeRequest change_request = 2;
    Assessment assessment = 3;
    EvidenceReference evidence_reference = 4;
  }
}
