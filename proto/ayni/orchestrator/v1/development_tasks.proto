syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/common.proto";
import "ayni/orchestrator/v1/runtime_profiles.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// DevelopmentTaskService manages frozen requests, attempts, and immutable candidates.
service DevelopmentTaskService {
  rpc ListDevelopmentTasks(ListDevelopmentTasksRequest) returns (ListDevelopmentTasksResponse);
  rpc GetDevelopmentTask(GetDevelopmentTaskRequest) returns (GetDevelopmentTaskResponse);
  rpc CreateDevelopmentTask(CreateDevelopmentTaskRequest) returns (CreateDevelopmentTaskResponse);
  rpc CancelDevelopmentTask(CancelDevelopmentTaskRequest) returns (CancelDevelopmentTaskResponse);
  rpc RetryDevelopmentTask(RetryDevelopmentTaskRequest) returns (RetryDevelopmentTaskResponse);
  rpc ListDevelopmentAttempts(ListDevelopmentAttemptsRequest) returns (ListDevelopmentAttemptsResponse);
  rpc GetDevelopmentAttempt(GetDevelopmentAttemptRequest) returns (GetDevelopmentAttemptResponse);
  rpc ListCandidates(ListCandidatesRequest) returns (ListCandidatesResponse);
  rpc GetCandidate(GetCandidateRequest) returns (GetCandidateResponse);
  rpc WatchDevelopmentTask(WatchDevelopmentTaskRequest) returns (stream WatchDevelopmentTaskResponse);
}

// DevelopmentTaskState is task progress, independent of publication and assessment.
enum DevelopmentTaskState {
  DEVELOPMENT_TASK_STATE_UNSPECIFIED = 0;
  DEVELOPMENT_TASK_STATE_QUEUED = 1;
  DEVELOPMENT_TASK_STATE_WAITING_FOR_RUNTIME = 2;
  DEVELOPMENT_TASK_STATE_RUNNING = 3;
  DEVELOPMENT_TASK_STATE_SUCCEEDED = 4;
  DEVELOPMENT_TASK_STATE_FAILED = 5;
  DEVELOPMENT_TASK_STATE_CANCELLED = 6;
  DEVELOPMENT_TASK_STATE_DEADLINE_EXCEEDED = 7;
  DEVELOPMENT_TASK_STATE_UNSUPPORTED = 8;
}

// DevelopmentAttemptState is one execution attempt's independent lifecycle.
enum DevelopmentAttemptState {
  DEVELOPMENT_ATTEMPT_STATE_UNSPECIFIED = 0;
  DEVELOPMENT_ATTEMPT_STATE_QUEUED = 1;
  DEVELOPMENT_ATTEMPT_STATE_RUNNING = 2;
  DEVELOPMENT_ATTEMPT_STATE_WAITING_FOR_INPUT = 3;
  DEVELOPMENT_ATTEMPT_STATE_SUCCEEDED = 4;
  DEVELOPMENT_ATTEMPT_STATE_FAILED = 5;
  DEVELOPMENT_ATTEMPT_STATE_CANCELLED = 6;
  DEVELOPMENT_ATTEMPT_STATE_DEADLINE_EXCEEDED = 7;
  DEVELOPMENT_ATTEMPT_STATE_UNSUPPORTED = 8;
}

// CandidateState records immutable candidate admission, not review readiness.
enum CandidateState {
  CANDIDATE_STATE_UNSPECIFIED = 0;
  CANDIDATE_STATE_AVAILABLE = 1;
  CANDIDATE_STATE_REJECTED = 2;
}

// ModelUsageStage identifies an attempt stage that makes model-provider requests.
enum ModelUsageStage {
  MODEL_USAGE_STAGE_UNSPECIFIED = 0;
  MODEL_USAGE_STAGE_CODING = 1;
  MODEL_USAGE_STAGE_CHANGE_SUMMARY = 2;
}

// ModelInteractionOutcome is the terminal state of one provider interaction.
enum ModelInteractionOutcome {
  MODEL_INTERACTION_OUTCOME_UNSPECIFIED = 0;
  MODEL_INTERACTION_OUTCOME_SUCCEEDED = 1;
  MODEL_INTERACTION_OUTCOME_FAILED = 2;
  MODEL_INTERACTION_OUTCOME_CANCELLED = 3;
}

// ModelUsageCollectionStatus states whether bounded usage is available and terminal.
enum ModelUsageCollectionStatus {
  MODEL_USAGE_COLLECTION_STATUS_UNSPECIFIED = 0;
  MODEL_USAGE_COLLECTION_STATUS_UNAVAILABLE = 1;
  MODEL_USAGE_COLLECTION_STATUS_COLLECTING = 2;
  MODEL_USAGE_COLLECTION_STATUS_COMPLETE = 3;
}

// AgentSelection freezes the agent and model selected for a task.
message AgentSelection {
  // provider, agent, and model are each 1 through 128 safe UTF-8 bytes.
  string provider = 1;
  string agent = 2;
  string model = 3;
}

// DevelopmentTaskRequest is the caller request before immutable identities are resolved.
message DevelopmentTaskRequest {
  string repository_connection_id = 1;
  // repository_revision is exactly 40 lowercase hexadecimal characters.
  string repository_revision = 2;
  string runtime_profile_id = 3;
  AgentSelection agent = 4;
  // request is 1 through 16,384 UTF-8 bytes.
  string request = 5;
  // acceptance_criteria contains 1 through 20 entries of at most 2,048 bytes each
  // and at most 16,384 aggregate bytes.
  repeated string acceptance_criteria = 6;
  ChangeConstraints change_constraints = 7;
  // deadline is 1 second through 24 hours when present.
  optional google.protobuf.Duration deadline = 8;
  // Retained for wire compatibility. New tasks always publish saved work as draft.
  bool publish_draft = 9;
}

// FrozenRepository freezes the source snapshot used by a task or attempt.
message FrozenRepository {
  string repository_connection_id = 1;
  string repository_snapshot_id = 2;
  // revision is exactly 40 lowercase hexadecimal characters.
  string revision = 3;
}

// FrozenRuntime freezes profile and OCI identity without a mutable tag.
message FrozenRuntime {
  string runtime_profile_id = 1;
  string runtime_profile_revision_id = 2;
  RuntimeProfileKind profile_kind = 3;
  string runtime_artifact_id = 4;
  // oci_repository is a normalized registry/repository name without tag or digest.
  string oci_repository = 5;
  // resolved_digest is `sha256:` followed by 64 lowercase hexadecimal characters.
  string resolved_digest = 6;
  OciPlatform platform = 7;
}

// DevelopmentSnapshot is the complete immutable execution input.
message DevelopmentSnapshot {
  FrozenRepository repository = 1;
  FrozenRuntime runtime = 2;
  AgentSelection agent = 3;
  string request = 4;
  repeated string acceptance_criteria = 5;
  ChangeConstraints change_constraints = 6;
  optional google.protobuf.Timestamp deadline_at = 7;
  bool publish_draft = 8;
  // Base branch observed when the publication request is frozen.
  string publication_base_branch = 9;
}

// ProviderTokenUsage preserves independent counters; absence never means zero.
message ProviderTokenUsage {
  optional uint64 input_tokens = 1;
  optional uint64 output_tokens = 2;
  optional uint64 cached_input_tokens = 3;
  optional uint64 reasoning_tokens = 4;
  optional uint64 total_tokens = 5;
}

// EstimatedModelCost is reproducible metadata and never provider billing truth.
message EstimatedModelCost {
  // label, currency, and pricing_version are each at most 64 safe UTF-8 bytes.
  string label = 1;
  uint64 amount_micros = 2;
  string currency = 3;
  string pricing_version = 4;
  uint64 priced_input_tokens = 5;
  uint64 priced_cached_input_tokens = 6;
  uint64 priced_output_tokens = 7;
  uint64 input_rate_micros_per_million = 8;
  uint64 cached_input_rate_micros_per_million = 9;
  uint64 output_rate_micros_per_million = 10;
}

// ModelUsageInteraction contains counters and correlation, never provider content.
message ModelUsageInteraction {
  // call_id is 1 through 128 safe ASCII bytes.
  string call_id = 1;
  ModelUsageStage stage = 2;
  string provider = 3;
  string model = 4;
  optional string resolved_model = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Duration latency = 8;
  ModelInteractionOutcome outcome = 9;
  ProviderTokenUsage tokens = 10;
  optional EstimatedModelCost estimated_cost = 11;
}

// ModelUsageSummary preserves unknown aggregate counters as absent fields.
message ModelUsageSummary {
  uint32 interaction_count = 1;
  uint32 unavailable_interaction_count = 2;
  optional uint64 input_tokens = 3;
  optional uint64 output_tokens = 4;
  optional uint64 cached_input_tokens = 5;
  optional uint64 reasoning_tokens = 6;
  optional uint64 total_tokens = 7;
  optional uint64 estimated_cost_micros = 8;
  optional string estimated_cost_currency = 9;
  optional string pricing_version = 10;
}

// StageModelUsage aggregates provider usage for one stage.
message StageModelUsage {
  ModelUsageStage stage = 1;
  ModelUsageSummary summary = 2;
}

// AttemptModelUsage is the complete bounded usage view for an attempt.
message AttemptModelUsage {
  ModelUsageCollectionStatus collection_status = 1;
  // interactions contains at most 64 prompt-free records.
  repeated ModelUsageInteraction interactions = 2;
  // by_stage contains at most one entry per known stage.
  repeated StageModelUsage by_stage = 3;
  ModelUsageSummary total = 4;
}

// DevelopmentTask is one durable request with frozen execution identity.
message DevelopmentTask {
  string id = 1;
  DevelopmentSnapshot snapshot = 2;
  DevelopmentTaskState state = 3;
  optional string active_attempt_id = 4;
  uint32 attempt_count = 5;
  optional ResourceFailure failure = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  uint64 resource_version = 9;
}

// AgentActivity is an advisory, content-free worker lifecycle observation.
message AgentActivity {
  uint32 sequence = 1;
  google.protobuf.Timestamp observed_at = 2;
  // message is a collector-owned description, never model or tool content.
  string message = 3;
  bool failed = 4;
}

// DevelopmentAttempt is one immutable-snapshot execution of a task.
message DevelopmentAttempt {
  string id = 1;
  string development_task_id = 2;
  uint32 attempt_number = 3;
  DevelopmentSnapshot snapshot = 4;
  DevelopmentAttemptState state = 5;
  // requested_input is a safe operator prompt of at most 1,024 UTF-8 bytes.
  optional string requested_input = 6;
  optional ResourceFailure failure = 7;
  AttemptModelUsage model_usage = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp completed_at = 11;
  uint64 resource_version = 12;
  // At most 256 recent observations, retained after worker cleanup.
  repeated AgentActivity agent_activity = 13;
}

// CandidateIdentity is the immutable output identity produced by an attempt.
message CandidateIdentity {
  oneof identity {
    GitCandidate git = 1;
    BundleCandidate bundle = 2;
  }
}

// GitCandidate identifies one exact provider-neutral Git commit.
message GitCandidate {
  // commit_sha is exactly 40 lowercase hexadecimal characters.
  string commit_sha = 1;
}

// BundleCandidate identifies immutable candidate bytes when no Git commit exists.
message BundleCandidate {
  // digest is `sha256:` followed by 64 lowercase hexadecimal characters.
  string digest = 1;
  uint64 size_bytes = 2;
}

// Candidate is immutable attempt output and is not a change request or assessment.
message Candidate {
  string id = 1;
  string development_attempt_id = 2;
  string repository_connection_id = 3;
  // base_revision is exactly 40 lowercase hexadecimal characters.
  string base_revision = 4;
  CandidateIdentity identity = 5;
  CandidateState state = 6;
  // changed_paths contains at most 256 normalized repository-relative paths and
  // at most 32,768 aggregate UTF-8 bytes.
  repeated string changed_paths = 7;
  optional ResourceFailure failure = 8;
  google.protobuf.Timestamp created_at = 9;
  uint64 resource_version = 10;
  // coding_advisory is bounded to 512 bytes. It is never assessment evidence.
  optional string coding_advisory = 11;
}

message ListDevelopmentTasksRequest {
  optional string repository_connection_id = 1;
  optional string runtime_profile_id = 2;
  optional DevelopmentTaskState state = 3;
  PageRequest page = 4;
}

message ListDevelopmentTasksResponse {
  repeated DevelopmentTask development_tasks = 1;
  PageResponse page = 2;
}

message GetDevelopmentTaskRequest {
  string development_task_id = 1;
}

message GetDevelopmentTaskResponse {
  DevelopmentTask development_task = 1;
}

message CreateDevelopmentTaskRequest {
  string idempotency_key = 1;
  DevelopmentTaskRequest request = 2;
}

message CreateDevelopmentTaskResponse {
  DevelopmentTask development_task = 1;
  DevelopmentAttempt initial_attempt = 2;
}

message CancelDevelopmentTaskRequest {
  string idempotency_key = 1;
  string development_task_id = 2;
}

message CancelDevelopmentTaskResponse {
  DevelopmentTask development_task = 1;
}

message RetryDevelopmentTaskRequest {
  string idempotency_key = 1;
  string development_task_id = 2;
}

message RetryDevelopmentTaskResponse {
  // attempt reuses the task's frozen snapshot; retry never silently changes runtime identity.
  DevelopmentAttempt attempt = 1;
}

message ListDevelopmentAttemptsRequest {
  string development_task_id = 1;
  PageRequest page = 2;
}

message ListDevelopmentAttemptsResponse {
  repeated DevelopmentAttempt attempts = 1;
  PageResponse page = 2;
}

message GetDevelopmentAttemptRequest {
  string development_attempt_id = 1;
}

message GetDevelopmentAttemptResponse {
  DevelopmentAttempt attempt = 1;
}

message ListCandidatesRequest {
  optional string development_task_id = 1;
  optional string development_attempt_id = 2;
  PageRequest page = 3;
}

message ListCandidatesResponse {
  repeated Candidate candidates = 1;
  PageResponse page = 2;
}

message GetCandidateRequest {
  string candidate_id = 1;
}

message GetCandidateResponse {
  Candidate candidate = 1;
}

message WatchDevelopmentTaskRequest {
  string development_task_id = 1;
  optional uint64 after_cursor = 2;
}

message WatchDevelopmentTaskResponse {
  uint64 cursor = 1;
  oneof update {
    DevelopmentTask development_task = 2;
    DevelopmentAttempt attempt = 3;
    Candidate candidate = 4;
  }
}
