syntax = "proto3";

package ayni.orchestrator.v1;

import "ayni/orchestrator/v1/common.proto";
import "ayni/orchestrator/v1/errors.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// DevelopmentTaskService submits and observes bounded repository-change workflows.
service DevelopmentTaskService {
  rpc ListDevelopmentTasks(ListDevelopmentTasksRequest) returns (ListDevelopmentTasksResponse);
  rpc GetDevelopmentTask(GetDevelopmentTaskRequest) returns (GetDevelopmentTaskResponse);
  rpc CreateDevelopmentTask(CreateDevelopmentTaskRequest) returns (CreateDevelopmentTaskResponse);
  rpc CancelDevelopmentTask(CancelDevelopmentTaskRequest) returns (CancelDevelopmentTaskResponse);
  rpc RetryDevelopmentTask(RetryDevelopmentTaskRequest) returns (RetryDevelopmentTaskResponse);
  rpc ProvideDevelopmentTaskInput(ProvideDevelopmentTaskInputRequest) returns (ProvideDevelopmentTaskInputResponse);
  rpc GetDevelopmentTaskEvidence(GetDevelopmentTaskEvidenceRequest) returns (GetDevelopmentTaskEvidenceResponse);
  rpc WatchDevelopmentTask(WatchDevelopmentTaskRequest) returns (stream WatchDevelopmentTaskResponse);
}

// DevelopmentTaskPhase is the durable phase of one development task.
enum DevelopmentTaskPhase {
  DEVELOPMENT_TASK_PHASE_UNSPECIFIED = 0;
  DEVELOPMENT_TASK_PHASE_QUEUED = 1;
  DEVELOPMENT_TASK_PHASE_CODING = 2;
  DEVELOPMENT_TASK_PHASE_WAITING_FOR_INPUT = 3;
  DEVELOPMENT_TASK_PHASE_VALIDATION_QUEUED = 4;
  DEVELOPMENT_TASK_PHASE_VALIDATING = 5;
  DEVELOPMENT_TASK_PHASE_PR_QUEUED = 6;
  DEVELOPMENT_TASK_PHASE_PREPARING_PR = 7;
  DEVELOPMENT_TASK_PHASE_COMPLETED = 8;
  DEVELOPMENT_TASK_PHASE_FAILED = 9;
  DEVELOPMENT_TASK_PHASE_CANCELLED = 10;
  DEVELOPMENT_TASK_PHASE_UNSUPPORTED = 11;
}

// LifecycleStage is a measurable stage in the development pipeline.
enum LifecycleStage {
  LIFECYCLE_STAGE_UNSPECIFIED = 0;
  LIFECYCLE_STAGE_QUEUE = 1;
  LIFECYCLE_STAGE_CODING = 2;
  LIFECYCLE_STAGE_VALIDATION = 3;
  LIFECYCLE_STAGE_PR_PREPARATION = 4;
  LIFECYCLE_STAGE_UNKNOWN = 5;
}

// LifecycleOutcome is the result recorded at a lifecycle boundary.
enum LifecycleOutcome {
  LIFECYCLE_OUTCOME_UNSPECIFIED = 0;
  LIFECYCLE_OUTCOME_QUEUED = 1;
  LIFECYCLE_OUTCOME_STARTED = 2;
  LIFECYCLE_OUTCOME_SUCCEEDED = 3;
  LIFECYCLE_OUTCOME_BLOCKED = 4;
  LIFECYCLE_OUTCOME_FAILED = 5;
  LIFECYCLE_OUTCOME_CANCELLED = 6;
  LIFECYCLE_OUTCOME_UNSUPPORTED = 7;
}

// ModelUsageStage identifies a stage that makes provider requests.
enum ModelUsageStage {
  MODEL_USAGE_STAGE_UNSPECIFIED = 0;
  MODEL_USAGE_STAGE_CODING = 1;
  MODEL_USAGE_STAGE_PR_PREPARATION = 2;
}

// ModelInteractionOutcome is the terminal state of one provider interaction.
enum ModelInteractionOutcome {
  MODEL_INTERACTION_OUTCOME_UNSPECIFIED = 0;
  MODEL_INTERACTION_OUTCOME_SUCCEEDED = 1;
  MODEL_INTERACTION_OUTCOME_FAILED = 2;
  MODEL_INTERACTION_OUTCOME_CANCELLED = 3;
}

// ModelUsageCollectionStatus states whether task usage is available and terminal.
enum ModelUsageCollectionStatus {
  MODEL_USAGE_COLLECTION_STATUS_UNSPECIFIED = 0;
  MODEL_USAGE_COLLECTION_STATUS_UNAVAILABLE = 1;
  MODEL_USAGE_COLLECTION_STATUS_COLLECTING = 2;
  MODEL_USAGE_COLLECTION_STATUS_COMPLETE = 3;
}

// EvidenceOutcome is the independently validated candidate outcome.
enum EvidenceOutcome {
  EVIDENCE_OUTCOME_UNSPECIFIED = 0;
  EVIDENCE_OUTCOME_SUCCESS = 1;
  EVIDENCE_OUTCOME_QUALITY_FAILURE = 2;
  EVIDENCE_OUTCOME_POLICY_REJECTED = 3;
  EVIDENCE_OUTCOME_DEPENDENCY_CHANGE_UNSUPPORTED = 4;
  EVIDENCE_OUTCOME_SCOPE_REJECTED = 5;
}

// DevelopmentTaskInput is the complete immutable user request frozen at submission.
message DevelopmentTaskInput {
  string repository_id = 1;
  string model = 2;
  // start_revision is an exact 40-character lowercase Git object ID.
  string start_revision = 3;
  // request is 1 through 16,384 UTF-8 bytes.
  string request = 4;
  // acceptance_criteria contains 1 through 20 entries of at most 2,048 bytes each.
  repeated string acceptance_criteria = 5;
  ChangeConstraints change_constraints = 6;
  // deadline is 1 second through 24 hours when present.
  optional google.protobuf.Duration deadline = 7;
}

// RepositorySnapshot is the repository identity frozen into a task.
message RepositorySnapshot {
  string id = 1;
  string owner = 2;
  string repository = 3;
  string base_branch = 4;
  string lock_sha256 = 5;
}

// ModelSnapshot is the provider and model identity frozen into a task.
message ModelSnapshot {
  string provider = 1;
  string model = 2;
}

// LifecycleEvent is one append-only, idempotent task transition.
message LifecycleEvent {
  uint64 sequence = 1;
  google.protobuf.Timestamp event_time = 2;
  LifecycleStage stage = 3;
  LifecycleOutcome outcome = 4;
  // reason_code is at most 64 lowercase ASCII identifier characters.
  optional string reason_code = 5;
}

// ProviderTokenUsage preserves provider counters independently; absence never means zero.
message ProviderTokenUsage {
  optional uint64 input_tokens = 1;
  optional uint64 output_tokens = 2;
  optional uint64 cached_input_tokens = 3;
  optional uint64 reasoning_tokens = 4;
  optional uint64 total_tokens = 5;
}

// EstimatedModelCost is a reproducible estimate and never provider billing truth.
message EstimatedModelCost {
  string label = 1;
  uint64 amount_micros = 2;
  string currency = 3;
  string pricing_version = 4;
  uint64 priced_input_tokens = 5;
  uint64 priced_cached_input_tokens = 6;
  uint64 priced_output_tokens = 7;
  uint64 input_rate_micros_per_million = 8;
  uint64 cached_input_rate_micros_per_million = 9;
  uint64 output_rate_micros_per_million = 10;
}

// ModelUsageInteraction contains bounded counters and correlation, never provider content.
message ModelUsageInteraction {
  string call_id = 1;
  ModelUsageStage stage = 2;
  string provider = 3;
  string model = 4;
  optional string resolved_model = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Duration latency = 8;
  ModelInteractionOutcome outcome = 9;
  ProviderTokenUsage tokens = 10;
  optional EstimatedModelCost estimated_cost = 11;
}

// ModelUsageSummary preserves unknown aggregate counters as absent fields.
message ModelUsageSummary {
  uint32 interaction_count = 1;
  uint32 unavailable_interaction_count = 2;
  optional uint64 input_tokens = 3;
  optional uint64 output_tokens = 4;
  optional uint64 cached_input_tokens = 5;
  optional uint64 reasoning_tokens = 6;
  optional uint64 total_tokens = 7;
  optional uint64 estimated_cost_micros = 8;
  optional string estimated_cost_currency = 9;
  optional string pricing_version = 10;
}

// StageModelUsage aggregates provider usage for one stage.
message StageModelUsage {
  ModelUsageStage stage = 1;
  ModelUsageSummary summary = 2;
}

// TaskModelUsage is the complete bounded usage view for a task.
message TaskModelUsage {
  ModelUsageCollectionStatus collection_status = 1;
  // interactions contains at most 64 prompt-free records.
  repeated ModelUsageInteraction interactions = 2;
  repeated StageModelUsage by_stage = 3;
  ModelUsageSummary total = 4;
}

// TaskFailure is the latest safe diagnostic for a non-success task.
message TaskFailure {
  ErrorReason reason = 1;
  // message is a credential-free operator diagnostic of at most 512 UTF-8 bytes.
  string message = 2;
}

// DevelopmentTask is one durable asynchronous request and its measured candidate.
message DevelopmentTask {
  string id = 1;
  DevelopmentTaskInput input = 2;
  RepositorySnapshot repository = 3;
  ModelSnapshot model = 4;
  optional string preparation_id = 5;
  optional string retry_of_task_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp deadline_at = 9;
  DevelopmentTaskPhase phase = 10;
  // requested_input is the agent's safe prompt to the operator, at most 1,024 UTF-8 bytes.
  optional string requested_input = 11;
  optional string candidate_commit = 12;
  // validation_manifest_digest is `sha256:` followed by 64 lowercase hexadecimal characters.
  optional string validation_manifest_digest = 13;
  optional bool policy_or_test_edits = 14;
  // scope_violations contains at most 512 bounded entries.
  repeated string scope_violations = 15;
  // draft_pr_url is an HTTPS URL of at most 2,048 UTF-8 bytes.
  optional string draft_pr_url = 16;
  optional TaskFailure failure = 17;
  bool lifecycle_complete = 18;
  // lifecycle contains at most 32 append-only transitions.
  repeated LifecycleEvent lifecycle = 19;
  TaskModelUsage model_usage = 20;
  // provided_input is set only on a linked follow-up created by ProvideDevelopmentTaskInput.
  optional string provided_input = 21;
  // resource_version increases for every durable change represented by this resource.
  uint64 resource_version = 22;
}

// DevelopmentTaskSummary is the bounded list projection; detail-only lifecycle,
// evidence, and interaction records are available from the task-specific RPCs.
message DevelopmentTaskSummary {
  string id = 1;
  string repository_id = 2;
  string repository_owner = 3;
  string repository_name = 4;
  string start_revision = 5;
  string request = 6;
  ModelSnapshot model = 7;
  optional string retry_of_task_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  DevelopmentTaskPhase phase = 11;
  optional string candidate_commit = 12;
  optional string draft_pr_url = 13;
  optional TaskFailure failure = 14;
  ModelUsageSummary model_usage = 15;
  uint64 resource_version = 16;
}

message ListDevelopmentTasksRequest {
  PageRequest page = 1;
  // phase restricts results when present.
  optional DevelopmentTaskPhase phase = 2;
}

message ListDevelopmentTasksResponse {
  repeated DevelopmentTaskSummary tasks = 1;
  PageResponse page = 2;
}

message GetDevelopmentTaskRequest {
  string task_id = 1;
}

message GetDevelopmentTaskResponse {
  DevelopmentTask task = 1;
}

message CreateDevelopmentTaskRequest {
  string idempotency_key = 1;
  DevelopmentTaskInput input = 2;
}

message CreateDevelopmentTaskResponse {
  // task normally starts in QUEUED; callers observe it until terminal.
  DevelopmentTask task = 1;
}

message CancelDevelopmentTaskRequest {
  string idempotency_key = 1;
  string task_id = 2;
}

message CancelDevelopmentTaskResponse {
  DevelopmentTask task = 1;
}

message RetryDevelopmentTaskRequest {
  string idempotency_key = 1;
  string task_id = 2;
}

message RetryDevelopmentTaskResponse {
  // task is a new linked task; the source task remains immutable.
  DevelopmentTask task = 1;
}

message ProvideDevelopmentTaskInputRequest {
  string idempotency_key = 1;
  string task_id = 2;
  // input is 1 through 8,192 UTF-8 bytes.
  string input = 3;
}

message ProvideDevelopmentTaskInputResponse {
  // task is a new linked follow-up; the source task remains immutable.
  DevelopmentTask task = 1;
}

// EvidenceArtifact identifies one digest-bound retained validation artifact.
message EvidenceArtifact {
  // name is a 1 through 128 byte safe relative artifact name.
  string name = 1;
  // sha256 is exactly 64 lowercase hexadecimal characters.
  string sha256 = 2;
}

// DevelopmentTaskEvidence is the trusted, digest-bound validation result.
message DevelopmentTaskEvidence {
  // manifest_digest is `sha256:` followed by 64 lowercase hexadecimal characters.
  string manifest_digest = 1;
  EvidenceOutcome outcome = 2;
  int32 check_exit_code = 3;
  string start_revision = 4;
  string candidate_commit = 5;
  string lock_sha256 = 6;
  optional ChangeConstraints change_constraints = 7;
  optional string preparation_id = 8;
  bool preparation_reused = 9;
  bool policy_edited = 10;
  bool tests_edited = 11;
  repeated string scope_violations = 12;
  // changed_paths contains at most 256 repository-relative paths.
  repeated string changed_paths = 13;
  // artifacts contains at most 16 digest-bound entries; artifact content is not in this API.
  repeated EvidenceArtifact artifacts = 14;
}

message GetDevelopmentTaskEvidenceRequest {
  string task_id = 1;
}

message GetDevelopmentTaskEvidenceResponse {
  DevelopmentTaskEvidence evidence = 1;
}

message WatchDevelopmentTaskRequest {
  string task_id = 1;
  // When absent, the server immediately sends the current snapshot. When set,
  // the server waits until a later resource version is durable.
  optional uint64 after_resource_version = 2;
}

message WatchDevelopmentTaskResponse {
  DevelopmentTask task = 1;
  // resource_version is a resumable cursor and equals task.resource_version.
  uint64 resource_version = 2;
}
