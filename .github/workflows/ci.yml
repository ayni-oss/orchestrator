name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify baseline files
        run: |
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f GOVERNANCE.md
          test -f MAINTAINERS.md
          test -f ROADMAP.md
          test -f .github/dco.yml
      - name: Reject milestone IDs in runtime files
        run: |
          historical_docs=(
            ':!docs/milestones.md'
            ':!docs/decisions/**'
            ':!docs/first-iteration.md'
            ':!docs/pilot-engineering-gates.md'
          )
          if git grep -nE '(^|[^[:alnum:]])[mM][0-9]+([^[:alnum:]]|$)' -- \
            . "${historical_docs[@]}"; then
            echo 'milestone IDs must not become current product concepts' >&2
            exit 1
          fi
          if find crates deploy examples scripts -type f -print \
            | grep -E '(^|/)[^/]*[mM][0-9]+[^/]*(/|$)'; then
            echo 'milestone IDs must not appear in runtime paths' >&2
            exit 1
          fi
