name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify baseline files
        run: |
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f GOVERNANCE.md
          test -f MAINTAINERS.md
          test -f ROADMAP.md
          test -f .github/dco.yml
          test -f docs/architecture.md
          test -f docs/local-development.md
          test -f docs/operations.md
      - name: Reject delivery-phase identifiers
        run: |
          if git grep -nE '(^|[^[:alnum:]])[mM][0-9]+([^[:alnum:]]|$)' -- .; then
            echo 'delivery-phase identifiers belong in linked issues and pull requests' >&2
            exit 1
          fi
          if find crates deploy docs examples scripts -type f -print \
            | grep -E '(^|/)[^/]*[mM][0-9]+[^/]*(/|$)'; then
            echo 'delivery-phase identifiers must not appear in repository paths' >&2
            exit 1
          fi
