name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request-title:
    name: pull request title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate squash-merge title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title.trim();
            const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9._/-]*\))?!?: \S.*\S$/;
            if (!pattern.test(title)) {
              core.setFailed(`PR title must match Conventional Commits; received: ${title}`);
            }

  policy:
    name: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify baseline files
        run: |
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f GOVERNANCE.md
          test -f MAINTAINERS.md
          test -f ROADMAP.md
          test -f .github/dco.yml
          test -f docs/architecture.md
          test -f docs/local-development.md
          test -f docs/operations.md
      - name: Reject delivery-phase identifiers
        run: |
          if git grep -nE '(^|[^[:alnum:]])[mM][0-9]+([^[:alnum:]]|$)' -- .; then
            echo 'delivery-phase identifiers belong in linked issues and pull requests' >&2
            exit 1
          fi
          if find crates deploy docs examples scripts -type f -print \
            | grep -E '(^|/)[^/]*[mM][0-9]+[^/]*(/|$)'; then
            echo 'delivery-phase identifiers must not appear in repository paths' >&2
            exit 1
          fi

  ayni:
    name: ayni managed quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Ayni
        env:
          AYNI_VERSION: 0.13.0
          AYNI_ARCHIVE: ayni-ayni-v0.13.0-x86_64-unknown-linux-gnu.tar.gz
          AYNI_SHA256: d0348577b129d9dac115b9a0bec164a73207c0d6a4bfdeb22ce8899060080ff8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$AYNI_ARCHIVE"
          install_root="$RUNNER_TEMP/ayni"
          bin_root="$RUNNER_TEMP/ayni-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/ayni-oss/ayni/releases/download/ayni-v$AYNI_VERSION/$AYNI_ARCHIVE"
          echo "$AYNI_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_root" "$bin_root"
          tar --extract --gzip --strip-components=1 --file "$archive" --directory "$install_root"
          install --mode=0755 "$install_root/ayni" "$bin_root/ayni"
          echo "$bin_root" >> "$GITHUB_PATH"

      - name: Build locked Ayni environment
        run: ayni env build --repo-root .

      - name: Verify Ayni environment
        run: ayni env doctor --repo-root .

      - name: Run Ayni repository check
        run: ayni check --config .ayni.toml

      - name: Retain Ayni evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-managed-evidence
          path: |
            .ayni/environment/build.json
            .ayni/last/
          retention-days: 14
          if-no-files-found: warn
