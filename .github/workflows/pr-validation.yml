name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  github-security:
    name: GitHub security boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify GitHub and GHCR security policy
        run: scripts/ci/check-github-security.sh

  metadata:
    name: conventional title and label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Validate title and apply kind label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title.trim();
            const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\(([a-z0-9][a-z0-9._/-]*)\))?(!)?: \S(?:.*\S)?$/;
            const match = title.match(pattern);
            const managed = [
              "kind/bug",
              "kind/chore",
              "kind/documentation",
              "kind/feature",
              "kind/security",
            ];
            const current = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const currentNames = new Set(current.map(({ name }) => name));

            let desired = null;
            if (match) {
              const [, type, scope = ""] = match;
              const scopeRoot = scope.split(/[./]/, 1)[0];
              if (scopeRoot === "security") {
                desired = "kind/security";
              } else if (type === "docs" || scopeRoot === "docs") {
                desired = "kind/documentation";
              } else if (type === "feat" || type === "perf") {
                desired = "kind/feature";
              } else if (type === "fix") {
                desired = "kind/bug";
              } else {
                desired = "kind/chore";
              }
            }

            for (const label of managed) {
              if (label !== desired && currentNames.has(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              }
            }

            if (desired && !currentNames.has(desired)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [desired],
              });
            }

            if (!match) {
              core.setFailed(`PR title must match Conventional Commits; received: ${title}`);
            }

  cncf:
    name: CNCF requirements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify required project files
        run: |
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f GOVERNANCE.md
          test -f MAINTAINERS.md
          test -f ROADMAP.md
          test -f .github/dco.yml
          test -f docs/architecture.md
          test -f docs/local-development.md
          test -f docs/operations.md

  deployment:
    name: Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Helm
        env:
          HELM_VERSION: 4.1.1
          HELM_SHA256: 5d4c7623283e6dfb1971957f4b755468ab64917066a8567dd50464af298f4031
        run: |
          archive="$RUNNER_TEMP/helm.tar.gz"
          install_root="$RUNNER_TEMP/helm"
          bin_root="$RUNNER_TEMP/helm-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_root" "$bin_root"
          tar --extract --gzip --file "$archive" --directory "$install_root"
          install --mode=0755 "$install_root/linux-amd64/helm" "$bin_root/helm"
          echo "$bin_root" >> "$GITHUB_PATH"

      - name: Validate deployment charts
        run: scripts/ci/check-helm.sh

  protobuf:
    name: protobuf contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout base contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .contract-base
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.71.0

      - name: Install locked protocol tools
        run: pnpm install --frozen-lockfile

      - name: Validate contract and generated bindings
        run: |
          if ! grep -qx 'clean-v1' proto/BASELINE; then
            echo 'The current protobuf baseline marker must be exactly clean-v1.' >&2
            exit 1
          elif ! test -f .contract-base/proto/BASELINE; then
            echo 'Buf breaking comparison reset from the retired pre-clean-v1 baseline.'
            scripts/ci/check-proto.sh
          elif cmp -s proto/BASELINE .contract-base/proto/BASELINE; then
            scripts/ci/check-proto.sh .contract-base/proto
          else
            echo 'Changing the established Buf baseline marker is not permitted.' >&2
            exit 1
          fi

      - name: Compile and test Rust bindings
        run: cargo test -p ayni-orchestrator-api

  ayni:
    name: Ayni
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Initialize report
        run: printf 'Ayni did not produce a report. See the workflow log for details.\n' > "$RUNNER_TEMP/ayni.md"

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Ayni
        env:
          AYNI_VERSION: 0.14.2
          AYNI_ARCHIVE: ayni-ayni-v0.14.2-x86_64-unknown-linux-gnu.tar.gz
          AYNI_SHA256: 73579859f48d57aec892ca382a1d740990b187d0ebccc2c8646aa34d821927ac
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$AYNI_ARCHIVE"
          install_root="$RUNNER_TEMP/ayni"
          bin_root="$RUNNER_TEMP/ayni-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/ayni-oss/ayni/releases/download/ayni-v$AYNI_VERSION/$AYNI_ARCHIVE"
          echo "$AYNI_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_root" "$bin_root"
          tar --extract --gzip --strip-components=1 --file "$archive" --directory "$install_root"
          install --mode=0755 "$install_root/ayni" "$bin_root/ayni"
          echo "$bin_root" >> "$GITHUB_PATH"

      - name: Run Ayni
        env:
          AYNI_EXECUTOR_IMAGE: ghcr.io/ayni-oss/ayni-env:0.14.2-debian@sha256:6b92c65b4592b043d58d6d4b6dc1b4fcf6c15ed8f6db59e9f3dd5dbe4dbbaba5
        run: |
          set +e
          image="ayni-pr:${{ github.event.pull_request.head.sha }}"
          ayni env build --repo-root . --tag "$image" --executor-image "$AYNI_EXECUTOR_IMAGE"
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/home \
              --env XDG_CACHE_HOME=/tmp/cache \
              --env MISE_CACHE_DIR=/tmp/mise \
              --env CARGO_HOME=/tmp/cargo \
              --env CARGO_TARGET_DIR=/tmp/target \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
              --workdir /workspace \
              "$image" \
              ayni check --config .ayni.toml --output markdown > "$RUNNER_TEMP/ayni.md"
            exit_code=$?
          fi
          exit "$exit_code"

      - name: Retain report for PR feedback
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni.md
          retention-days: 1
          if-no-files-found: error

  report:
    name: Ayni PR comment
    needs: ayni
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Download Ayni report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni-report

      - name: Create or update Ayni comment
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/ayni-report/ayni.md
          AYNI_RESULT: ${{ needs.ayni.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ayni-signals -->';
            const result = process.env.AYNI_RESULT;
            const status = result === 'success' ? 'passed' : result;
            let report = 'Ayni did not produce a report. See the workflow log for details.\n';
            if (fs.existsSync(process.env.REPORT_PATH)) {
              report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            }
            if (report.length > 60000) {
              report = `${report.slice(0, 60000)}\n\n_Report truncated; see the workflow log for the full result._\n`;
            }
            const body = `${marker}\n## Ayni: ${status}\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
