name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # One active validation run per PR; independent jobs start together.
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  github-security:
    name: GitHub security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify GitHub and GHCR security policy
        run: scripts/ci/check-github-security.sh

  metadata:
    name: PR metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Validate title and apply kind label
        uses: ayni-oss/ayni/.github/actions/pr-metadata@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          kind-labels: true

  cncf:
    name: Project requirements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify required project files
        uses: ayni-oss/ayni/.github/actions/project-files@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          additional-files: |
            docs/technical/architecture/architecture.md
            docs/technical/operations/local-development.md
            docs/technical/operations/operations.md

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up locked documentation dependencies
        uses: ayni-oss/ayni/.github/actions/node-project@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          package-manager: pnpm
          node-version: 24.14.0
      - run: pnpm docs:check

  deployment:
    name: Deployment charts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Helm
        env:
          HELM_VERSION: 4.1.1
          HELM_SHA256: 5d4c7623283e6dfb1971957f4b755468ab64917066a8567dd50464af298f4031
        run: |
          archive="$RUNNER_TEMP/helm.tar.gz"
          install_root="$RUNNER_TEMP/helm"
          bin_root="$RUNNER_TEMP/helm-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_root" "$bin_root"
          tar --extract --gzip --file "$archive" --directory "$install_root"
          install --mode=0755 "$install_root/linux-amd64/helm" "$bin_root/helm"
          echo "$bin_root" >> "$GITHUB_PATH"

      - name: Validate deployment charts
        run: scripts/ci/check-helm.sh

  protobuf:
    name: API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout base contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .contract-base
          persist-credentials: false

      - name: Set up locked protocol dependencies
        uses: ayni-oss/ayni/.github/actions/node-project@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          package-manager: pnpm
          node-version: 24.14.0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.71.0

      - name: Validate contract and generated bindings
        run: |
          if ! grep -qx 'workflow-m1-private-v1' proto/BASELINE; then
            echo 'The current protobuf baseline marker must be exactly workflow-m1-private-v1.' >&2
            exit 1
          elif test -f .contract-base/proto/BASELINE && grep -qx 'repository-builders-v4' .contract-base/proto/BASELINE; then
            echo 'Buf breaking comparison reset for the intentional M1 private-v1 authority cutover.'
            scripts/ci/check-proto.sh
          elif cmp -s proto/BASELINE .contract-base/proto/BASELINE; then
            scripts/ci/check-proto.sh .contract-base/proto
          else
            echo 'Changing the established Buf baseline marker is not permitted.' >&2
            exit 1
          fi

      - name: Validate canonical private-v1 cutover
        run: scripts/ci/check-workflow-private-v1-feasibility.sh

      - name: Compile and test Rust bindings
        run: cargo test -p ayni-orchestrator-api -p ayni-orchestrator-events

  integration:
    name: Rust and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test acceptance report integrity
        run: python3 -m unittest discover -s dev/lib -p 'test_*.py'
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Test required loopback fixtures
        run: scripts/ci/check-workflow-loopback.sh
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test cumulative M1 authority, transport and recovery
        run: scripts/ci/check-workflow-m1.sh

  ayni:
    name: Ayni quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Initialize report
        run: printf 'Ayni did not produce a report. See the workflow log for details.\n' > "$RUNNER_TEMP/ayni.md"

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Ayni
        id: cli
        run: |
          set -euo pipefail
          release=scripts/ci/ayni-tool.json
          AYNI_VERSION=$(jq -er .cli_version "$release")
          AYNI_ARCHIVE="ayni-ayni-v${AYNI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          AYNI_SHA256=$(jq -er .linux_amd64_archive_sha256 "$release")
          archive="$RUNNER_TEMP/$AYNI_ARCHIVE"
          install_root="$RUNNER_TEMP/ayni"
          bin_root="$RUNNER_TEMP/ayni-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/ayni-oss/ayni/releases/download/ayni-v$AYNI_VERSION/$AYNI_ARCHIVE"
          echo "$AYNI_SHA256  $archive" | sha256sum --check
          mkdir -p "$install_root" "$bin_root"
          tar --extract --gzip --strip-components=1 --file "$archive" --directory "$install_root"
          install --mode=0755 "$install_root/ayni" "$bin_root/ayni"
          echo "cli=$bin_root/ayni" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Reuse or build the locked repository environment
        uses: ayni-oss/ayni/.github/actions/managed-check@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          cli: ${{ steps.cli.outputs.cli }}
          repository: ${{ github.repository }}
      - name: Upload Ayni JSON evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-evidence
          path: .ayni/last/signals.json
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Ayni report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni.md
          retention-days: 1
          if-no-files-found: warn

  report:
    name: Ayni report
    needs: ayni
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Create or update Ayni comment
        uses: ayni-oss/ayni/.github/actions/quality-report@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          result: ${{ needs.ayni.result }}
