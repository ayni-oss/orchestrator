name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # One active validation run per PR; independent jobs start together.
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  github-security:
    name: GitHub security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify GitHub and GHCR security policy
        run: cargo xtask check security

  metadata:
    name: PR metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Validate title and apply kind label
        uses: ayni-oss/ayni/.github/actions/pr-metadata@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          kind-labels: true

  cncf:
    name: Project requirements
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify required project files
        uses: ayni-oss/ayni/.github/actions/project-files@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          additional-files: |
            docs/technical/architecture/architecture.md
            docs/technical/operations/local-development.md
            docs/technical/operations/operations.md

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up locked documentation dependencies
        uses: ayni-oss/ayni/.github/actions/node-project@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          package-manager: pnpm
          node-version: 24.14.0
      - name: Validate product frontend
        run: |
          pnpm --filter @ayni-orchestrator/web check
          pnpm --filter @ayni-orchestrator/web test
          pnpm web:build
      - run: pnpm docs:check

  deployment:
    name: Deployment charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Helm
        run: cargo xtask install helm

      - name: Validate deployment charts
        run: cargo xtask check charts

  protobuf:
    name: API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout base contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .contract-base
          persist-credentials: false

      - name: Set up locked protocol dependencies
        uses: ayni-oss/ayni/.github/actions/node-project@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          package-manager: pnpm
          node-version: 24.14.0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.71.0

      - name: Validate contract and generated bindings
        run: cargo xtask check contract-baseline

      - name: Validate canonical private-v1 cutover
        run: cargo xtask check api

  # Ordinary Rust tests run once through the Ayni quality contract.
  # Browser, PostgreSQL, JetStream and loopback acceptance remain local-only.
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test Rust tooling and evidence integrity
        run: cargo test --locked -p ayni-orchestrator-xtask -p ayni-orchestrator-bootstrap
      - name: Enforce tooling language boundary
        run: cargo xtask check tooling
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  ayni:
    name: Ayni quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Initialize report
        run: printf 'Ayni did not produce a report. See the workflow log for details.\n' > "$RUNNER_TEMP/ayni.md"

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Ayni
        id: cli
        run: cargo xtask install ayni

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Reuse or build the locked repository environment
        uses: ayni-oss/ayni/.github/actions/managed-check@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          cli: ${{ steps.cli.outputs.cli }}
          repository: ${{ github.repository }}
      - name: Upload Ayni JSON evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-evidence
          path: .ayni/last/signals.json
          retention-days: 1
          if-no-files-found: warn
      - name: Upload Ayni report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayni-pr-report
          path: ${{ runner.temp }}/ayni.md
          retention-days: 1
          if-no-files-found: warn

  report:
    name: Ayni report
    needs: ayni
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Create or update Ayni comment
        uses: ayni-oss/ayni/.github/actions/quality-report@82966446499f11f5668dd314a432c8ab74788c3d # shared CI
        with:
          result: ${{ needs.ayni.result }}
