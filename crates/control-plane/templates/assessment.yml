# ayni-orchestrator-template: ayni-managed-v2
# Only reviewed default-branch code executes on the runner. Candidate code is isolated.
name: Ayni Managed assessment
on:
  workflow_run:
    workflows: [Ayni assessment request]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: read
  checks: write
  pull-requests: write
concurrency:
  group: assessment-${{ github.repository_id }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true
jobs:
  assess:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ASSESSMENT_PRODUCER_IMAGE: ${{ vars.ASSESSMENT_PRODUCER_IMAGE }}
      ASSESSMENT_PROFILE_REVISION: ${{ vars.ASSESSMENT_PROFILE_REVISION }}
      ASSESSMENT_IMAGE_REPOSITORY: ${{ vars.ASSESSMENT_IMAGE_REPOSITORY }}
      ASSESSMENT_RUNTIME_DIGEST: ${{ vars.ASSESSMENT_RUNTIME_DIGEST }}
      ASSESSMENT_LOCK_FINGERPRINT: ${{ vars.ASSESSMENT_LOCK_FINGERPRINT }}
      ASSESSMENT_CONTRACT_DIGEST: ${{ vars.ASSESSMENT_CONTRACT_DIGEST }}
    steps:
      - name: Install checksum-pinned Ayni
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "$RUNNER_TEMP/ayni.tar.gz" \
            https://github.com/ayni-oss/ayni/releases/download/ayni-v@@AYNI_VERSION@@/ayni-ayni-v@@AYNI_VERSION@@-x86_64-unknown-linux-gnu.tar.gz
          echo "@@AYNI_SHA256@@  $RUNNER_TEMP/ayni.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/ayni-bin"
          tar -xzf "$RUNNER_TEMP/ayni.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/ayni-bin"
          "$RUNNER_TEMP/ayni-bin/ayni" --version
          echo "$RUNNER_TEMP/ayni-bin" >> "$GITHUB_PATH"
      - name: Install trusted collector
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ASSESSMENT_PRODUCER_IMAGE" =~ ^ghcr.io/[a-z0-9/._-]+@sha256:[a-f0-9]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull --platform linux/amd64 "$ASSESSMENT_PRODUCER_IMAGE"
          id=$(docker create "$ASSESSMENT_PRODUCER_IMAGE")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          docker cp "$id:/usr/local/bin/ayni-orchestrator-worker" "$RUNNER_TEMP/assessment-collector"
          chmod 500 "$RUNNER_TEMP/assessment-collector"
      - name: Measure exact head and update projections
        run: '"$RUNNER_TEMP/assessment-collector" assess-actions'
      - name: Retain immutable assessment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assessment-evidence/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
