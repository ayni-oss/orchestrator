apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: ayni-orchestrator-control-plane
    app.kubernetes.io/part-of: ayni-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ayni-orchestrator-control-plane
        app.kubernetes.io/part-of: ayni-orchestrator
    spec:
      serviceAccountName: control-plane
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: local/ayni-orchestrator-control-plane:replace-me
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: control-plane-config
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: durable-state
              mountPath: /data
            - name: control-plane-scratch
              mountPath: /tmp
      volumes:
        - name: durable-state
          persistentVolumeClaim:
            claimName: control-plane-state
        - name: control-plane-scratch
          emptyDir:
            sizeLimit: 64Mi
