apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ayni-orchestrator-web
    app.kubernetes.io/part-of: ayni-orchestrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ayni-orchestrator-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: web
      protocol: TCP
