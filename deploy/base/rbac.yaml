apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: ayni-orchestrator-control-plane
    app.kubernetes.io/part-of: ayni-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-attempt-jobs
  labels:
    app.kubernetes.io/part-of: ayni-orchestrator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-attempt-jobs
  labels:
    app.kubernetes.io/part-of: ayni-orchestrator
subjects:
  - kind: ServiceAccount
    name: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-attempt-jobs
