apiVersion: v1
kind: Service
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: ayni-orchestrator-control-plane
    app.kubernetes.io/part-of: ayni-orchestrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ayni-orchestrator-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # The process is required to bind this target to pod loopback. Normal
    # Service traffic addresses the pod IP and cannot reach it; kubectl
    # port-forward enters the pod network namespace and can reach loopback.
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
