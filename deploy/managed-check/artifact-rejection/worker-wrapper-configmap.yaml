apiVersion: v1
kind: ConfigMap
metadata:
  name: managed-check-artifact-rejection-wrapper
  labels:
    app.kubernetes.io/component: evidence-integrity-test
data:
  ayni: |
    #!/bin/sh
    set -eu

    if [ "$#" -gt 0 ] && [ "$1" = "check" ]; then
      set +e
      /usr/local/bin/ayni "$@"
      status="$?"
      rm -f /workspace/repository/.ayni/last/execution.json
      exit "$status"
    fi

    exec /usr/local/bin/ayni "$@"
