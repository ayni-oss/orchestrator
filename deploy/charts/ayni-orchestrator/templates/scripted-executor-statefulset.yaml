{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scripted-executor
  labels:
    {{- include "ayni-orchestrator.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-scripted-executor
spec:
  serviceName: scripted-executor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-scripted-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ayni-orchestrator-scripted-executor
        app.kubernetes.io/part-of: ayni-orchestrator
        orchestrator.ayni.dev/jetstream-client: "true"
    spec:
      serviceAccountName: conversation-session-supervisor
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scripted-executor
          image: {{ required "images.scriptedExecutor is required" .Values.images.scriptedExecutor | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: ORCHESTRATOR_MCP_ENABLED
              value: {{ .Values.providers.mcp.enabled | quote }}
            - name: ORCHESTRATOR_ANTHROPIC_ENABLED
              value: {{ .Values.providers.anthropic.enabled | quote }}
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.providers.anthropic.baseUrl | quote }}
            - name: ORCHESTRATOR_OPENAI_ENABLED
              value: {{ .Values.providers.openai.enabled | quote }}
            {{- if .Values.providers.openai.enabled }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.providers.openai.baseUrl | quote }}
            {{- end }}
            - name: ORCHESTRATOR_SESSION_AUTHORITY_URL
              value: {{ printf "http://control-plane:%v/v1/session-authority" .Values.controlPlane.httpPort | quote }}
            - name: ORCHESTRATOR_SESSION_AUTHORITY_TOKEN_PATH
              value: /var/run/secrets/ayni/session-authority/token
            - name: ORCHESTRATOR_SESSION_NAMESPACE
              value: {{ printf "%s-sessions" .Release.Namespace | quote }}
            - name: ORCHESTRATOR_SESSION_IMAGE
              value: {{ required "images.scriptedExecutor is required" .Values.images.scriptedExecutor | quote }}
            - name: ORCHESTRATOR_EXECUTOR_BROKER_URL
              value: {{ .Values.workflowJetstream.url | quote }}
            - name: ORCHESTRATOR_EXECUTOR_BROKER_USERNAME
              value: {{ .Values.workflowJetstream.executorUsername | quote }}
            - name: ORCHESTRATOR_EXECUTOR_BROKER_PASSWORD_PATH
              value: /var/run/secrets/ayni/workflow-jetstream-executor/password
            - name: ORCHESTRATOR_EXECUTOR_INSTANCE_ID_PATH
              value: /var/run/secrets/ayni/workflow-jetstream-executor/instance-id
            - name: ORCHESTRATOR_EXECUTOR_SIGNING_SEED_PATH
              value: /var/run/secrets/ayni/workflow-jetstream-executor/signing-seed-hex
            - name: ORCHESTRATOR_EXECUTOR_LEDGER_PATH
              value: /var/lib/ayni-executor/ledger.sqlite
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'grep -q ''"ready":true'' /var/lib/ayni-executor/ledger.health.json'
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.scriptedExecutor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: ledger
              mountPath: /var/lib/ayni-executor
            - name: workflow-jetstream-executor
              mountPath: /var/run/secrets/ayni/workflow-jetstream-executor
              readOnly: true
            - name: session-authority
              mountPath: /var/run/secrets/ayni/session-authority
              readOnly: true
      volumes:
        - name: session-authority
          secret:
            secretName: {{ .Values.providers.sessionAuthoritySecretName | quote }}
            items:
              - key: token
                path: token
        - name: workflow-jetstream-executor
          secret:
            secretName: {{ required "workflowJetstream.executorSecretName is required" .Values.workflowJetstream.executorSecretName | quote }}
            items:
              - key: password
                path: password
              - key: instance-id
                path: instance-id
              - key: signing-seed-hex
                path: signing-seed-hex
  volumeClaimTemplates:
    - metadata:
        name: ledger
        labels:
          app.kubernetes.io/name: ayni-orchestrator-scripted-executor
          app.kubernetes.io/part-of: ayni-orchestrator
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.scriptedExecutor.storage }}
{{- end }}
