{{- if and .Values.enabled .Values.runtime.enabled }}
{{- if .Values.runtime.serviceAccounts.create }}
{{- range $name := list "runtime-coding" "runtime-builder" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
imagePullSecrets:
  {{- toYaml $.Values.runtime.serviceAccounts.imagePullSecrets | nindent 2 }}
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-config
data:
  runtime.json: {{ dict "namespace" .Release.Namespace "worker_image" (required "runtime.workerImage must be digest pinned" .Values.runtime.workerImage) "output_claim" .Values.runtime.outputClaim "model_secret" .Values.runtime.modelSecret "interval_seconds" .Values.runtime.intervalSeconds "request_timeout_seconds" .Values.runtime.requestTimeoutSeconds "coding_turns" .Values.runtime.codingTurns "quality_repair_limit" .Values.runtime.qualityRepairLimit "concurrency" .Values.runtime.concurrency "allow_emulation" .Values.runtime.allowEmulation "profiles" .Values.runtime.profiles "managed_runtime" .Values.runtime.managedRuntime | toJson | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.runtime.outputClaim }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.runtime.outputSize }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-controller
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, delete]
  # Attempt credentials are written and refreshed without reading secret values.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-controller
subjects:
  - kind: ServiceAccount
    name: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-controller
{{- end }}
