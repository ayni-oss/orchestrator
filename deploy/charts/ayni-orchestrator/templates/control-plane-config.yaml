{{- if .Values.enabled }}
{{- if eq .Values.postgres.migratorSecretName .Values.postgres.runtimeSecretName }}
{{- fail "postgres migrator and runtime Secret names must differ" }}
{{- end }}
{{- if or (eq .Values.jetstream.applicationSecretName .Values.postgres.runtimeSecretName) (eq .Values.jetstream.applicationSecretName .Values.postgres.migratorSecretName) }}
{{- fail "workflow JetStream application and PostgreSQL Secret names must differ" }}
{{- end }}
{{- if or (eq .Values.jetstream.executorSecretName .Values.jetstream.applicationSecretName) (eq .Values.jetstream.executorSecretName .Values.postgres.runtimeSecretName) (eq .Values.jetstream.executorSecretName .Values.postgres.migratorSecretName) }}
{{- fail "workflow executor and application/database Secret names must differ" }}
{{- end }}
{{- if or (eq .Values.providers.sessionAuthoritySecretName .Values.postgres.runtimeSecretName) (eq .Values.providers.sessionAuthoritySecretName .Values.postgres.migratorSecretName) (eq .Values.providers.sessionAuthoritySecretName .Values.jetstream.applicationSecretName) (eq .Values.providers.sessionAuthoritySecretName .Values.jetstream.executorSecretName) }}
{{- fail "session authority Secret must be distinct from database and broker Secrets" }}
{{- end }}
{{- if .Values.providers.openai.fixtureEgress }}
{{- if not .Values.providers.openai.enabled }}
{{- fail "provider fixture egress requires explicit OpenAI execution enablement" }}
{{- end }}
{{- if ne .Values.providers.openai.baseUrl (printf "http://provider-fixture.%s.svc:8080/v1" .Release.Namespace) }}
{{- fail "provider fixture egress requires the scoped local provider-fixture endpoint" }}
{{- end }}
{{- else if not (hasPrefix "https://" .Values.providers.openai.baseUrl) }}
{{- fail "provider endpoint must use HTTPS outside the explicit fixture profile" }}
{{- end }}
{{- if .Values.providers.anthropic.fixtureEgress }}
{{- if not .Values.providers.anthropic.enabled }}
{{- fail "Anthropic fixture egress requires explicit execution enablement" }}
{{- end }}
{{- if ne .Values.providers.anthropic.baseUrl (printf "http://provider-fixture.%s.svc:8080/v1" .Release.Namespace) }}
{{- fail "Anthropic fixture egress requires the scoped local provider-fixture endpoint" }}
{{- end }}
{{- else if not (hasPrefix "https://" .Values.providers.anthropic.baseUrl) }}
{{- fail "Anthropic endpoint must use HTTPS outside the explicit fixture profile" }}
{{- end }}
{{- if eq (int .Values.controlPlane.httpPort) (int .Values.controlPlane.trustedGrpcPort) }}
{{- fail "controlPlane HTTP and trusted gRPC ports must differ" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-config
  labels:
    {{- include "ayni-orchestrator.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-control-plane
data:
{{- with include "ayni-orchestrator.traceEndpoint" . }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ . | quote }}
{{- end }}
  ORCHESTRATOR_HTTP_BIND_ADDRESS: "0.0.0.0:{{ .Values.controlPlane.httpPort }}"
  # The canonical private-v1 workflow API is pod-local by design. Operators
  # reach it only through an explicit pod port-forward for diagnostics.
  ORCHESTRATOR_GRPC_BIND_ADDRESS: "127.0.0.1:{{ .Values.controlPlane.trustedGrpcPort }}"
  ORCHESTRATOR_WORKFLOW_MIGRATION_DATABASE_URL_PATH: /var/run/secrets/ayni/workflow-postgres-migrator/url
  ORCHESTRATOR_WORKFLOW_DATABASE_URL_PATH: /var/run/secrets/ayni/workflow-postgres-runtime/url
  ORCHESTRATOR_WORKFLOW_DATABASE_ROLE: {{ .Values.postgres.runtimeRoleName | quote }}
  ORCHESTRATOR_WORKFLOW_BROKER_URL: {{ .Values.jetstream.url | quote }}
  ORCHESTRATOR_WORKFLOW_BROKER_USERNAME: {{ .Values.jetstream.username | quote }}
  ORCHESTRATOR_WORKFLOW_BROKER_PASSWORD_PATH: /var/run/secrets/ayni/workflow-jetstream-application/password
{{- if .Values.publication.enabled }}
  ORCHESTRATOR_PUBLICATION_AUTHORITY_TOKEN_PATH: /var/run/secrets/ayni/publication-authority/token
  ORCHESTRATOR_PUBLICATION_WORKSPACE_ID: {{ .Values.publication.workspaceId | quote }}
  ORCHESTRATOR_PUBLICATION_REPOSITORY: {{ .Values.publication.repository | quote }}
{{- end }}
{{- end }}
