{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    {{- include "ayni-orchestrator.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ayni-orchestrator-control-plane
        app.kubernetes.io/part-of: ayni-orchestrator
        orchestrator.ayni.dev/jetstream-client: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/control-plane-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: workflow-migrate
          image: {{ required "images.controlPlane is required" .Values.images.controlPlane | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/usr/local/bin/workflow-migrate"]
          envFrom:
            - configMapRef:
                name: control-plane-config
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workflow-postgres-migrator
              mountPath: /var/run/secrets/ayni/workflow-postgres-migrator
              readOnly: true
      containers:
        - name: control-plane
          image: {{ required "images.controlPlane is required" .Values.images.controlPlane | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: ORCHESTRATOR_SESSION_AUTHORITY_TOKEN_PATH
              value: /var/run/secrets/ayni/session-authority/token
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.httpPort }}
              protocol: TCP
            - name: trusted-grpc
              containerPort: {{ .Values.controlPlane.trustedGrpcPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workflow-postgres-runtime
              mountPath: /var/run/secrets/ayni/workflow-postgres-runtime
              readOnly: true
            - name: workflow-jetstream-application
              mountPath: /var/run/secrets/ayni/workflow-jetstream-application
              readOnly: true
            - name: session-authority
              mountPath: /var/run/secrets/ayni/session-authority
              readOnly: true
      volumes:
        - name: session-authority
          secret:
            secretName: {{ .Values.providers.sessionAuthoritySecretName | quote }}
            items:
              - key: token
                path: token
        - name: workflow-postgres-migrator
          secret:
            secretName: {{ required "workflowPostgres.migratorSecretName is required" .Values.workflowPostgres.migratorSecretName | quote }}
            items:
              - key: url
                path: url
        - name: workflow-postgres-runtime
          secret:
            secretName: {{ required "workflowPostgres.runtimeSecretName is required" .Values.workflowPostgres.runtimeSecretName | quote }}
            items:
              - key: url
                path: url
        - name: workflow-jetstream-application
          secret:
            secretName: {{ required "workflowJetstream.applicationSecretName is required" .Values.workflowJetstream.applicationSecretName | quote }}
            items:
              - key: password
                path: password
{{- end }}
