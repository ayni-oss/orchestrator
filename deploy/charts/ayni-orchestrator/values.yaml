enabled: true

# Opt-in, credential-free runtime source policy. Secret values never belong here.
runtime:
  enabled: false
  workerImage: ""
  outputClaim: runtime-outputs
  outputSize: 4Gi
  modelSecret: openai-api
  intervalSeconds: 300
  requestTimeoutSeconds: 30
  codingTurns: 24
  qualityRepairLimit: 3
  concurrency: 4
  # Docker Desktop-only architecture emulation is enabled by the local chart.
  # Production releases retain strict runtime platform scheduling.
  allowEmulation: false
  engineMode: external-isolated
  # Infrastructure policy is administrator-managed; the UI configures image identities.
  builderDefaults: null
  profiles: {}
  # Deployment-wide policy for connected managed repositories; no repository map.
  # The local chart supplies this policy automatically.
  managedRuntime: null
  serviceAccounts:
    create: true
    imagePullSecrets: []

images:
  controlPlane: local/ayni-orchestrator-control-plane:replace-me
  web: local/ayni-orchestrator-web:replace-me
  pullPolicy: IfNotPresent

# Local development only. The Docker Desktop umbrella chart enables this through
# its ignored hot-reload overlay; reusable installations retain immutable images.
development:
  hotReload:
    enabled: false

connections:
  githubAppSecretName: ""
  testImage: ""
  # Explicit safe metadata only; referenced Secrets remain administrator-owned.
  adminRegistries: []
  # Explicit signing Secret references, imported as read-only certificates.
  adminCertificates: []

controlPlane:
  maxAttempts: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

persistence:
  controlPlaneState:
    size: 1Gi

customClients:
  enabled: false
  secretName: custom-client-grpc-access
