enabled: true

images:
  controlPlane: local/ayni-orchestrator-control-plane:replace-me
  scriptedExecutor: local/ayni-orchestrator-scripted-executor:replace-me
  pullPolicy: IfNotPresent

workflowPostgres:
  # These immutable Secrets are administrator-owned. Each must contain a `url`
  # key with a PostgreSQL connection string for its distinct database role.
  migratorSecretName: workflow-postgres-migrator
  runtimeSecretName: workflow-postgres-runtime
  runtimeRoleName: ayni_runtime

workflowJetstream:
  # The application identity may publish command/decision facts and consume reports.
  # This immutable Secret contains only its own `password` key.
  url: nats://jetstream:4222
  username: workflow-application
  applicationSecretName: workflow-jetstream-application
  executorUsername: workflow-executor
  executorSecretName: workflow-jetstream-executor

providers:
  openai:
    # Enabling this permits paid requests only for explicitly configured workspaces
    # with a provider-openai-<workspace UUID without hyphens> Secret in the session namespace.
    enabled: false
    baseUrl: https://api.openai.com/v1
    # Local deterministic fixture access is a separate explicit network capability.
    fixtureEgress: false
  sessionAuthoritySecretName: workflow-session-authority

scriptedExecutor:
  storage: 512Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

controlPlane:
  replicaCount: 1
  httpPort: 8080
  trustedGrpcPort: 50051
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

taskExecution:
  enabled: true
  # Deterministic coding is strictly an acceptance fixture, disabled by default.
  fixtureEnabled: false

# Publication is separately authorized for one explicit workspace/repository.
# Both administrator-owned Secrets contain only a token key.
publication:
  enabled: false
  workspaceId: ""
  repository: ""
  authoritySecretName: workflow-publication-authority
  githubSecretName: ""
  fixtureEnabled: false
  fixtureApiUrl: ""
  fixtureGitUrl: ""
