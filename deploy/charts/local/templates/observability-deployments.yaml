{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "local.observabilityLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-prometheus
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: ayni-orchestrator-prometheus
        app.kubernetes.io/part-of: ayni-orchestrator-observability
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.observability.prometheus.retentionTime }}
            - --storage.tsdb.retention.size={{ .Values.observability.prometheus.retentionSize }}
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.observability.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    {{- include "local.observabilityLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
        app.kubernetes.io/part-of: ayni-orchestrator-observability
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: {{ .Values.observability.kubeStateMetrics.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --namespaces={{ .Release.Namespace }}
            - --resources=pods,jobs,persistentvolumeclaims
            - --metric-labels-allowlist=pods=[app.kubernetes.io/name,app.kubernetes.io/part-of,orchestrator.ayni.dev/development-task-id,orchestrator.ayni.dev/task-id,orchestrator.ayni.dev/development-stage],jobs=[app.kubernetes.io/name,app.kubernetes.io/part-of,orchestrator.ayni.dev/development-task-id,orchestrator.ayni.dev/task-id,orchestrator.ayni.dev/development-stage]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.observability.kubeStateMetrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "local.observabilityLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-grafana
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: ayni-orchestrator-grafana
        app.kubernetes.io/part-of: ayni-orchestrator-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
              subPath: dashboard-provider.yaml
              readOnly: true
            - name: dashboard
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
