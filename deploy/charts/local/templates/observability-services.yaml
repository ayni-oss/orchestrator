{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "local.observabilityLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ayni-orchestrator-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    {{- include "local.observabilityLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "local.observabilityLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ayni-orchestrator-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
{{- end }}
