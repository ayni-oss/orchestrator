{{- if .Values.core.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: ayni-orchestrator-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-attempt-jobs
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-attempt-jobs
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-attempt-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-development-clone-secrets
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-development-clone-secrets
  labels:
    {{- include "local.commonLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-development-clone-secrets
{{- end }}
