apiVersion: v2
name: local
description: Ayni Orchestrator local development stack for Docker Desktop Kubernetes
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.32.0-0"
dependencies:
  - name: ayni-orchestrator
    version: 0.1.0
    repository: file://../ayni-orchestrator
    condition: ayni-orchestrator.enabled
  - name: prometheus
    version: 27.38.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: observability.enabled
  - name: kube-state-metrics
    version: 6.1.5
    repository: https://prometheus-community.github.io/helm-charts
    condition: observability.enabled
  - name: grafana
    version: 10.0.0
    repository: https://grafana.github.io/helm-charts
    condition: observability.enabled
