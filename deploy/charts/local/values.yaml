core:
  enabled: true

images:
  controlPlane: local/ayni-orchestrator-control-plane:replace-me
  worker: local/ayni-orchestrator-worker:replace-me
  web: local/ayni-orchestrator-web:replace-me
  pullPolicy: Never

controlPlane:
  maxAttempts: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

persistence:
  controlPlaneState:
    size: 1Gi
  developmentCheckpoints:
    size: 2Gi
  managedCheckEvidence:
    size: 2Gi
  preparedEnvironments:
    size: 10Gi

customClients:
  enabled: false
  secretName: custom-client-grpc-access

observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    retentionTime: 48h
    retentionSize: 900MB
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 300m
        memory: 384Mi
  kubeStateMetrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0@sha256:e750cd4b43f782e3106537026c2995cac85d921aedea334e1d16caad7877c360
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi

fixtures:
  managedCheck:
    enabled: false
    createEvidenceClaim: false
  artifactRejection:
    enabled: false
  repositoryUrl: https://github.com/ayni-oss/ayni.git
  revision: 4e67795c0cba21bd82c21bdd6c921417fbe29ff6
  lockSha256: d68ca2ac621c99865bf7b50aabc668f1e9e4b85aa79389c00e13fcda4bb56fc7
  ayniVersion: 0.13.0
