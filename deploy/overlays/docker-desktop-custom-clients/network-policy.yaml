apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: custom-client-grpc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-control-plane
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 3000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ayni-orchestrator-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ayni-orchestrator-custom-client
      ports:
        - port: 50052
          protocol: TCP
