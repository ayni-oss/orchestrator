apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  template:
    spec:
      containers:
        - name: control-plane
          env:
            - name: M3_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: m3-github-app
                  key: app-id
            - name: M3_GITHUB_PRIVATE_KEY_PATH
              value: /run/secrets/github/private-key.pem
            - name: M3_CHECKPOINT_ROOT
              value: /checkpoints
            - name: M3_EVIDENCE_ROOT
              value: /evidence
            - name: M3_INTERNAL_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: m3-publisher
                  key: token
          volumeMounts:
            - name: github-app-key
              mountPath: /run/secrets/github
              readOnly: true
            - name: m3-checkpoints
              mountPath: /checkpoints
              readOnly: true
            - name: m3-evidence
              mountPath: /evidence
              readOnly: true
      volumes:
        - name: github-app-key
          secret:
            secretName: m3-github-app
            defaultMode: 288
        - name: m3-checkpoints
          persistentVolumeClaim:
            claimName: m3-checkpoints
            readOnly: true
        - name: m3-evidence
          persistentVolumeClaim:
            claimName: managed-check-evidence
            readOnly: true
