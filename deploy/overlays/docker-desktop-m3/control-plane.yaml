apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  template:
    spec:
      containers:
        - name: control-plane
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-credentials
                  key: app-id
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /run/secrets/github/private-key.pem
            - name: DEVELOPMENT_CHECKPOINT_ROOT
              value: /checkpoints
            - name: DEVELOPMENT_EVIDENCE_ROOT
              value: /evidence
            - name: DEVELOPMENT_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: development-publisher-auth
                  key: token
          volumeMounts:
            - name: github-app-key
              mountPath: /run/secrets/github
              readOnly: true
            - name: development-checkpoints
              mountPath: /checkpoints
              readOnly: true
            - name: development-evidence
              mountPath: /evidence
              readOnly: true
      volumes:
        - name: github-app-key
          secret:
            secretName: github-app-credentials
            defaultMode: 288
        - name: development-checkpoints
          persistentVolumeClaim:
            claimName: development-checkpoints
            readOnly: true
        - name: development-evidence
          persistentVolumeClaim:
            claimName: managed-check-evidence
            readOnly: true
