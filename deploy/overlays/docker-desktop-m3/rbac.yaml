apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-m3-clone-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-m3-clone-secrets
subjects:
  - kind: ServiceAccount
    name: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-m3-clone-secrets
