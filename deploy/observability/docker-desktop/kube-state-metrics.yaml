apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
    app.kubernetes.io/part-of: ayni-orchestrator-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
        app.kubernetes.io/part-of: ayni-orchestrator-observability
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0@sha256:e750cd4b43f782e3106537026c2995cac85d921aedea334e1d16caad7877c360
          imagePullPolicy: IfNotPresent
          args:
            - --namespaces=ayni-orchestrator-dev
            - --resources=pods,jobs,persistentvolumeclaims
            - --metric-labels-allowlist=pods=[app.kubernetes.io/name,app.kubernetes.io/part-of,orchestrator.ayni.dev/development-task-id,orchestrator.ayni.dev/task-id,orchestrator.ayni.dev/development-stage],jobs=[app.kubernetes.io/name,app.kubernetes.io/part-of,orchestrator.ayni.dev/development-task-id,orchestrator.ayni.dev/task-id,orchestrator.ayni.dev/development-stage]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
    app.kubernetes.io/part-of: ayni-orchestrator-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ayni-orchestrator-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
