apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ayni-orchestrator-dev
resources:
  - monitoring-rbac.yaml
  - monitoring-config.yaml
  - prometheus.yaml
  - kube-state-metrics.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboard
    files:
      - orchestrator-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: ayni-orchestrator-grafana
        app.kubernetes.io/part-of: ayni-orchestrator-observability
