[checks]
test = true
coverage = false
size = true
complexity = true
deps = true
mutation = false

[languages]
enabled = ["rust"]

[concurrency]
amount = 1

# Fits the standard two-core GitHub-hosted runner while remaining explicit for
# local and orchestrated managed checks.
[environment.resources]
cpus = 2
memory_mib = 6144
memory_swap_mib = 6144
pids = 2048
nofile = 8192

[rust]
roots = ["."]

[rust.size]
# Current repository baseline is 986 lines; keep it visible as a warning and
# reject growth beyond the next explicit ceiling.
"*.rs" = { warn = 400, fail = 1000, exclude = ["target/**", ".ayni/**"] }

[rust.complexity]
# Current repository baseline is 30; warnings preserve the refactoring signal.
fn_cyclomatic = { warn = 10, fail = 31 }
fn_cognitive = { warn = 20, fail = 29 }

[rust.deps.forbidden]
"crates/api" = ["crates/domain", "crates/observability", "crates/control-plane", "crates/worker"]
"crates/domain" = ["crates/control-plane", "crates/worker"]
"crates/control-plane" = ["crates/worker"]
"crates/worker" = ["crates/control-plane"]
