[checks]
test = true
coverage = false
size = true
complexity = true
deps = true
mutation = false

[languages]
enabled = ["rust", "node"]

[concurrency]
amount = 1

# Fits the standard two-core GitHub-hosted runner while remaining explicit for
# local and orchestrated managed checks.
[environment.resources]
cpus = 2
memory_mib = 6144
memory_swap_mib = 6144
pids = 2048
nofile = 8192

[rust]
roots = ["."]

[rust.size]
# Current repository baseline is 986 lines; keep it visible as a warning and
# reject growth beyond the next explicit ceiling.
"*.rs" = { warn = 400, fail = 1000, exclude = ["target/**", ".ayni/**", ".worktrees/**"] }

[rust.complexity]
# Current repository baseline is 30; warnings preserve the refactoring signal.
fn_cyclomatic = { warn = 10, fail = 31 }
fn_cognitive = { warn = 20, fail = 29 }

[rust.deps.forbidden]
"backend/servers/control-plane/crates/application" = ["backend/servers/control-plane/crates/grpc-contract", "backend/servers/control-plane/crates/kubernetes", "backend/servers/control-plane", "backend/workers/*", "backend/libs/runtime/profiles/ayni", "backend/libs/integrations/github-actions", "backend/libs/observability"]
"backend/servers/control-plane/crates/grpc-contract" = ["backend/libs/domain", "backend/libs/observability", "backend/libs/runtime/contracts", "backend/libs/runtime/profiles/ayni", "backend/servers/control-plane/crates/kubernetes", "backend/servers/control-plane", "backend/workers/runtime-worker"]
"backend/libs/domain" = ["backend/servers/control-plane/crates/application", "backend/servers/control-plane/crates/grpc-contract", "backend/libs/observability", "backend/libs/runtime/contracts", "backend/libs/runtime/profiles/ayni", "backend/servers/control-plane/crates/kubernetes", "backend/servers/control-plane", "backend/workers/runtime-worker"]
"backend/libs/runtime/contracts" = ["backend/servers/control-plane/crates/application", "backend/servers/control-plane/crates/grpc-contract", "backend/libs/observability", "backend/libs/runtime/profiles/ayni", "backend/servers/control-plane/crates/kubernetes", "backend/servers/control-plane", "backend/workers/runtime-worker"]
"backend/libs/runtime/profiles/ayni" = ["backend/servers/control-plane/crates/application", "backend/servers/control-plane/crates/grpc-contract", "backend/libs/observability", "backend/servers/control-plane/crates/kubernetes", "backend/servers/control-plane", "backend/workers/runtime-worker"]
"backend/servers/control-plane/crates/kubernetes" = ["backend/libs/runtime/profiles/ayni", "backend/libs/integrations/github-actions", "backend/servers/control-plane/crates/grpc-contract", "backend/servers/control-plane", "backend/workers/runtime-worker"]
"backend/servers/control-plane" = ["backend/workers/runtime-worker"]
"backend/workers/runtime-worker" = ["backend/servers/control-plane/crates/application", "backend/servers/control-plane/crates/grpc-contract", "backend/servers/control-plane/crates/kubernetes", "backend/servers/control-plane"]

"backend/libs/integrations/github-actions" = ["backend/servers/*", "backend/workers/*", "backend/libs/observability"]

# Package roots keep generated protobuf bindings out of source-quality budgets.
# Their TypeScript compilation remains part of the frontend compatibility check.
[node]
roots = ["apps/web", "packages/bff"]

[node.tooling.test]
command = "pnpm"
args = ["--reporter=silent", "run", "test", "--reporter=json"]

[node.size]
"**/*.ts" = { warn = 350, fail = 600, exclude = ["**/node_modules/**", "**/.svelte-kit/**", "**/build/**", "**/coverage/**", "**/.vitest/**", "**/test-results/**", "**/.ayni/**"] }
"**/*.js" = { warn = 350, fail = 600, exclude = ["**/node_modules/**", "**/.svelte-kit/**", "**/build/**"] }
"**/*.mjs" = { warn = 350, fail = 600, exclude = ["**/node_modules/**", "**/.svelte-kit/**", "**/build/**"] }
"**/*.svelte" = { warn = 350, fail = 600, exclude = ["**/node_modules/**", "**/.svelte-kit/**", "**/build/**"] }

[node.complexity]
# Existing task-form action measures 26; warn without hiding that baseline.
fn_cyclomatic = { warn = 10, fail = 30 }

[node.deps.forbidden]
"packages/bff" = ["apps/*"]
"clients/typescript" = ["apps/*", "packages/*"]
