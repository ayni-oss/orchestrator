[checks]
test = true
coverage = false
size = true
complexity = true
deps = true
mutation = false

[languages]
enabled = ["rust"]

[concurrency]
amount = 1

[environment]
certificate = { trusted_keys = { project-2026 = "503e65851ff2ac80d18ef4a5aafeeaa4664e816be09138662c1723a75f611c3a" } }

# Fits the standard two-core GitHub-hosted runner while remaining explicit for
# local and orchestrated managed checks.
[environment.resources]
cpus = 2
memory_mib = 6144
memory_swap_mib = 6144
pids = 2048
nofile = 8192

[rust]
roots = ["."]

[rust.size]
# Keep the largest production modules visible without permitting another
# monolithic workflow owner.
"*.rs" = { warn = 400, fail = 1000, exclude = ["target/**", ".ayni/**", ".worktrees/**"] }

[rust.complexity]
fn_cyclomatic = { warn = 10, fail = 31 }
fn_cognitive = { warn = 20, fail = 29 }

[rust.deps.forbidden]
"backend/libs/events" = ["backend/libs/domain", "backend/libs/observability", "backend/libs/oci", "backend/libs/providers", "backend/libs/registry", "backend/servers/*", "backend/workers/*"]
"backend/libs/oci" = ["backend/libs/domain", "backend/libs/observability", "backend/libs/providers", "backend/libs/registry", "backend/servers/*", "backend/workers/*"]
"backend/libs/providers" = ["backend/servers/*", "backend/workers/*"]
"backend/libs/registry" = ["backend/servers/*", "backend/workers/*"]
"backend/servers/control-plane/crates/grpc-contract" = ["backend/libs/domain", "backend/libs/observability", "backend/libs/providers", "backend/libs/registry", "backend/servers/control-plane", "backend/servers/control-plane/crates/workflow-postgres", "backend/workers/*"]
"backend/servers/control-plane/crates/workflow-postgres" = ["backend/libs/domain", "backend/libs/observability", "backend/libs/oci", "backend/libs/providers", "backend/libs/registry", "backend/servers/control-plane", "backend/servers/control-plane/crates/grpc-contract", "backend/workers/*"]
"backend/servers/control-plane" = ["backend/workers/*"]
"backend/workers/conversation-supervisor" = ["backend/servers/control-plane", "backend/servers/control-plane/crates/grpc-contract", "backend/servers/control-plane/crates/workflow-postgres"]
